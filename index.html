<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetainIQ | Banking Intelligence</title><style>:root{font-family:Inter,ui-sans-serif,system-ui;background:#071824;color:#eaf7f3}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;cursor:pointer}button{border:0}aside{width:235px;background:#0c2532;padding:28px 16px;min-height:100vh;position:fixed;border-right:1px solid #23414a}aside h2{margin:0 12px 34px;color:#9cf2cd}nav button{width:100%;text-align:left;background:transparent;color:#a9c4c5;padding:13px;border-radius:12px;margin-bottom:6px}nav button.active,nav button:hover{background:#1a3d48;color:#b8ffe0}main{margin-left:235px;padding:35px;max-width:1500px}.muted{color:#92aeb5}.tag{background:#194c44;color:#a4ffcd;border-radius:30px;padding:6px 11px;font-size:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:#102c39;border:1px solid #264854;border-radius:20px;padding:22px}.metric{font-size:29px;font-weight:750;margin:12px 0}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:20px}.item{display:flex;justify-content:space-between;align-items:center;padding:15px;border:1px solid #284b56;border-radius:13px;margin:10px 0;cursor:pointer;transition:.2s}.item:hover,.item.selected{background:#1a4550;transform:translateY(-2px);border-color:#91f4c5}.pill{border-radius:30px;padding:5px 10px;background:#56352e;color:#ffb4a1}.medium{background:#55462c;color:#f6d28a}.low{background:#1d5148;color:#a4f2cc}.primary{background:#a5f5ce;color:#0a2630;border-radius:12px;padding:13px 18px;font-weight:750}.primary:hover{background:#d3ffe7}.primary:disabled{opacity:.55}.bar{height:8px;background:#244651;border-radius:20px;overflow:hidden}.fill{height:100%;background:#8cf1c2}select{background:#163641;color:#e7fff7;border:1px solid #345661;border-radius:9px;padding:10px}h1{font-size:32px;margin-bottom:4px}h3{margin-top:0}section{animation:enter .35s ease}@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@media(max-width:900px){aside{position:static;width:auto;min-height:0;padding:16px}aside h2{margin:0 0 12px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{margin:0;padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:470px){.grid{grid-template-columns:1fr 1fr}.metric{font-size:22px}.card{padding:15px}}</style><aside><h2>◈ retainIQ</h2><nav id="nav"></nav><p class="muted" style="font-size:12px;margin-top:32px">DEMO MODE<br>Fictional borrower data only</p></aside><main><div class="top"><div><div class="muted">INTELLIGENCE PLATFORM / AUSTRALIA</div><h1 id="heading">Command Centre</h1></div><span class="tag">● Demo environment</span></div><p class="muted" id="subtitle">Your portfolio, made actionable.</p><section id="content"></section></main><script>const borrowers=[{id:'HL-1042',name:'Borrower 1042',balance:685000,rate:6.19,risk:91,reason:'Fixed-rate expiry in 45 days',action:'Schedule a pricing review'},{id:'HL-1087',name:'Borrower 1087',balance:492000,rate:6.34,risk:83,reason:'Rate above comparable internal offers',action:'Review available retention options'},{id:'HL-1123',name:'Borrower 1123',balance:810000,rate:5.94,risk:72,reason:'Recent mortgage discharge enquiry',action:'Assign relationship manager'},{id:'HL-1198',name:'Borrower 1198',balance:355000,rate:5.89,risk:55,reason:'Reduced engagement',action:'Check in on lending needs'},{id:'HL-1214',name:'Borrower 1214',balance:570000,rate:5.75,risk:24,reason:'No significant current signals',action:'Continue standard servicing'}];const modules=['Command Centre','Mortgage Retention','Financial Health','Retention Intelligence','Onboarding Optimiser','Integrations'];let tab=0,selected=0,filter='All';let queue=JSON.parse(localStorage.getItem('retainiq-demo-queue')||'[]');const money=n=>'$'+Math.round(n).toLocaleString('en-AU');const risk=b=>b.risk>=70?'High':b.risk>=40?'Medium':'Low';function metrics(arr){return '<div class="grid">'+arr.map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div><small class="muted">'+x[2]+'</small></div>').join('')+'</div>'}function choose(i){selected=i;render()}function add(){const id=borrowers[selected].id;if(!queue.includes(id))queue.push(id);localStorage.setItem('retainiq-demo-queue',JSON.stringify(queue));render()}function setFilter(v){filter=v;render()}function mortgage(){let rows=borrowers.map((b,i)=>({...b,i})).filter(b=>filter==='All'||risk(b)===filter);let b=borrowers[selected];return metrics([['Portfolio monitored','$2.91m','5 fictional loans'],['High-risk exposure','$1.99m','3 priority borrowers'],['Review queue',queue.length,'Locally saved'],['Opportunities','5','Illustrative only']])+'<div class="layout"><div class="card"><div class="top"><h3>Retention opportunities</h3><select onchange="setFilter(this.value)">'+['All','High','Medium','Low'].map(x=>'<option '+(x===filter?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+rows.map(x=>'<div class="item '+(selected===x.i?'selected':'')+'" onclick="choose('+x.i+')"><div><b>'+x.name+'</b><div class="muted">'+money(x.balance)+' · '+x.reason+'</div></div><span class="pill '+risk(x).toLowerCase()+'">'+x.risk+'/100</span></div>').join('')+'</div><div class="card"><span class="tag">Borrower intelligence</span><h2>'+b.name+'</h2><p class="muted">'+b.id+' · '+money(b.balance)+' outstanding</p><h3>Risk signal: '+b.risk+'/100</h3><div class="bar"><div class="fill" style="width:'+b.risk+'%"></div></div><p>'+b.reason+'</p><h3>Suggested next action</h3><p>'+b.action+'</p><p class="muted">Review suitability and contact permissions before acting.</p><button class="primary" onclick="add()" '+(queue.includes(b.id)?'disabled':'')+'>'+(queue.includes(b.id)?'✓ In review queue':'+ Add to review queue')+'</button></div></div>'}function render(){document.getElementById('nav').innerHTML=modules.map((m,i)=>'<button class="'+(tab===i?'active':'')+'" onclick="tab='+i+';render()">'+['◫','⌂','♡','◎','↗','⛓'][i]+' &nbsp; '+m+'</button>').join('');document.getElementById('heading').textContent=modules[tab];document.getElementById('subtitle').textContent=['Your portfolio, made actionable.','See the signals before customers leave.','Help customers understand their money.','Find opportunities across the customer relationship.','Make every application easier to complete.','Connect without replacing core banking systems.'][tab];let c=tab<=1?mortgage():tab===2?metrics([['Monthly inflow','$7,450','Example household'],['Monthly outflow','$5,910','Example household'],['Cash buffer','$1,540','Illustrative'],['Upcoming bills','4','Next 30 days']])+'<div class="card" style="margin-top:20px"><h3>Financial wellbeing signals</h3><p>Projected cash buffer and upcoming commitments, designed for a bank-branded customer experience.</p><div class="bar"><div class="fill" style="width:68%"></div></div><p class="muted">Demo indicators only. Not financial advice.</p></div>':tab===3?metrics([['Customers reviewed','1,240','Synthetic sample'],['Engagement alerts','86','Illustrative'],['Potential opportunities','32','For team review'],['Actions queued',queue.length,'Demo actions']])+'<div class="card" style="margin-top:20px"><h3>Relationship signals</h3><p>Combine product engagement, service events and customer needs to suggest timely, relevant conversations.</p><button class="primary" onclick="tab=1;render()">Explore mortgage opportunities →</button></div>':tab===4?metrics([['Applications started','1,000','Demo funnel'],['Identity verification','720','72% progress'],['Documents uploaded','530','53% progress'],['Completed','410','41% conversion']])+'<div class="card" style="margin-top:20px"><h3>Onboarding friction map</h3><p class="muted">Illustrative completion rate by step</p>'+[['Start',100],['Identity',72],['Documents',53],['Submit',41]].map(x=>'<p>'+x[0]+' · '+x[1]+'%</p><div class="bar"><div class="fill" style="width:'+x[1]+'%"></div></div>').join('')+'<p>Potential experiment: simplify document requests and test contextual guidance.</p></div>':'<div class="layout"><div class="card"><h3>Integration paths</h3><p>① Secure batch ingestion for a pilot</p><p>② Approved API integrations for production</p><p>③ Dedicated enterprise deployment</p></div><div class="card"><h3>Security by design</h3><p>Bank-controlled access, encryption, tenant isolation, logging, retention policies and formal vendor assessment are required before production.</p><span class="tag">No live banking connection</span></div></div>';document.getElementById('content').innerHTML=c}render()</script></html>
