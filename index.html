<style>
html,body{background:#f7f8fc!important;color:#273047!important;font-family:Arial,system-ui,sans-serif!important}#ri-app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}#ri-side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid #e9eaf2;padding:24px 14px}#ri-brand{font-size:26px;font-weight:850;letter-spacing:-1.6px;padding:4px 12px 30px;color:#26314a}#ri-brand span{color:#7159dd}#ri-side button{display:block;width:100%;text-align:left;background:transparent;color:#7d8599;padding:14px;border-radius:12px;margin-bottom:6px;font-size:13px;font-weight:700;border:0}#ri-side button.on{background:#f0edff;color:#6b55d1}#ri-main{min-width:0;padding:30px 35px 80px;max-width:1350px;width:100%;margin:auto}#ri-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e9eaf2;padding-bottom:23px;margin-bottom:28px}#ri-top strong{color:#273047}#ri-top span{color:#18896f;background:#e9f9f2;border-radius:30px;padding:8px 12px;font-size:11px;font-weight:700}#ri-main h1{font-size:clamp(28px,3.6vw,44px);letter-spacing:-1.7px;color:#28324b;margin:9px 0 10px}#ri-main h2{font-size:20px;color:#27314a;letter-spacing:-.5px;margin:0 0 15px}#ri-main h3{color:#27314a;font-size:15px;margin:8px 0}#ri-main p{color:#818a9d;font-size:13px;line-height:1.65}#ri-main .ri-kicker{color:#795dd9;font-weight:800;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}#ri-main .ri-intro{max-width:750px;font-size:15px;margin-bottom:30px}#ri-main .ri-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}#ri-main .ri-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}#ri-main .ri-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}#ri-main .ri-card{background:#fff;border:1px solid #e8eaf3;border-radius:18px;padding:22px;box-shadow:0 5px 25px #2e31500a;min-width:0}#ri-main .ri-card .ri-num{font-size:33px;font-weight:850;letter-spacing:-1px;color:#5849b9;margin:11px 0 6px}#ri-main .ri-label{font-size:11px;font-weight:700;color:#8c96a8}#ri-main .ri-section{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:35px 0 16px}#ri-main .ri-section h2{margin:0}#ri-main .ri-section span{color:#9aa3b3;font-size:12px}#ri-main .ri-btn{border:0;background:#6d57d9;color:white;padding:12px 17px;border-radius:11px;font-weight:800;font-size:12px;cursor:pointer}#ri-main .ri-btn:hover{background:#5440c0}#ri-main .ri-btn.alt{background:#f1eeff;color:#6854cc}#ri-main .ri-tile{display:flex;flex-direction:column;gap:10px}#ri-main .ri-tile p{flex:1;margin:0}#ri-main .ri-tile .ri-btn{width:100%;margin-top:8px}#ri-main .ri-chip{display:inline-block;background:#f2eeff;color:#6b56cc;padding:7px 10px;border-radius:20px;font-size:10px;font-weight:800;width:max-content}#ri-main .ri-chip.red{background:#fff0ee;color:#d36c69}#ri-main .ri-chip.amber{background:#fff6e7;color:#ba8330}#ri-main .ri-chip.green{background:#e9f8f1;color:#228d70}#ri-main .ri-data{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f1f6;padding:13px 0;gap:10px;font-size:12px}#ri-main .ri-data:last-child{border:0}#ri-main .ri-data b{color:#34405a}#ri-main .ri-data small{color:#8e97a7;display:block;margin-top:4px}#ri-main .ri-chart{display:flex;align-items:end;justify-content:space-around;gap:12px;height:170px;border-bottom:1px solid #e9eaf2;margin-top:17px}#ri-main .ri-bar{display:flex;align-items:center;flex-direction:column;justify-content:end;flex:1;height:100%;gap:7px}#ri-main .ri-bar i{width:55%;max-width:55px;border-radius:7px 7px 0 0}#ri-main .ri-bar b{font-size:12px;color:#33405a}#ri-main .ri-bar small{font-size:10px;color:#919aad;text-align:center}#ri-main .ri-score{display:flex;align-items:center;gap:19px;margin:18px 0}#ri-main .ri-ring{height:118px;width:118px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}#ri-main .ri-ring div{background:white;width:87px;height:87px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:850;color:#2d3750}#ri-main .ri-factor{margin:17px 0}#ri-main .ri-track{background:#eff0f6;border-radius:20px;height:9px;overflow:hidden;margin:9px 0}#ri-main .ri-track i{display:block;height:100%;border-radius:20px;background:#7e6adf}#ri-main input[type=range]{width:100%;accent-color:#725bda}#ri-main select{padding:11px;border:1px solid #e7e7f1;border-radius:9px;background:white;color:#33405a;width:100%}#ri-main .ri-notice{padding:15px;border-radius:12px;background:#eef9f4;color:#278367;font-size:12px;margin:18px 0}#ri-main .ri-foot{margin-top:40px;color:#9ba4b3;font-size:11px}#ri-main .ri-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}#ri-main .ri-steps .ri-card{padding:17px}#ri-main .ri-steps b{font-size:23px;color:#745edb}@media(max-width:1000px){#ri-main .ri-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#ri-main .ri-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:750px){#ri-app{display:block}#ri-side{position:static;height:auto;padding:13px;border-bottom:1px solid #e9eaf2}#ri-brand{padding:0 4px 10px}#ri-links{display:flex;overflow:auto;gap:4px}#ri-side button{white-space:nowrap;width:auto;margin:0;padding:10px}#ri-main{padding:24px 15px 50px}#ri-main .ri-grid.two,#ri-main .ri-grid.three{grid-template-columns:1fr}#ri-main .ri-steps{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){#ri-main .ri-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#ri-main .ri-card{padding:16px}#ri-main .ri-card .ri-num{font-size:25px}}


:root{color-scheme:light}
html,body{background:#f5f5f7!important;color:#1d1d1f!important;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif!important;-webkit-font-smoothing:antialiased}
#ri-app{grid-template-columns:218px minmax(0,1fr);background:#f5f5f7}

#ri-main h1{font-size:clamp(37px,5vw,62px)!important;line-height:1.08!important;letter-spacing:-2.7px!important;font-weight:740!important;color:#1d1d1f!important;max-width:850px}

</style></head><body><div id="ri-app"><div id="ri-side"><div id="ri-brand">retain<span>IQ</span></div><div id="ri-links"></div></div><div id="ri-main"><div id="ri-top"><strong id="ri-crumb">Overview</strong><span>● Fictional interactive demo</span></div><div id="ri-content"></div><div id="ri-action-status" role="status" hidden style="position:fixed;bottom:22px;right:22px;background:#1d1d1f;color:white;padding:16px 20px;border-radius:15px;max-width:360px;font-size:12px;box-shadow:0 10px 45px #0002;z-index:30"></div><div class="ri-foot">RetainIQ showcase · All customer records, scores and outcomes are illustrative. No actual customer data or messages.</div></div></div><script>
const riNames=['Overview','Gym retention','Mortgage retention','Experience lab','Financial health','Growth intelligence','How it works'];
let riTab=0,riCustomer=0,riMode='retention',riTweaks={},riActions=[],riBill=1200,riIncome=6500,riCosts=4300;
const riGym=[68,104,256,72],riMortgage=[54,96,278,72],riColors=['#f29c91','#f2c478','#83c9b1','#9cb4c7'];
const riDefs={gym:[['Attendance decline',40,35],['Days since last visit',30,25],['Cancelled classes',15,12],['Payment issues',15,10]],retention:[['Fixed-rate expiry',25,22],['Rate competitiveness',25,20],['Refinance enquiries',30,26],['Service friction',20,13]],distress:[['Repayment arrears',35,9],['Repayment burden',30,14],['Income disruption',20,6],['Financial buffer',15,8]]};
function riBtn(t,action,alt=false){return '<button class="ri-btn'+(alt?' alt':'')+'" onclick="'+action+'">'+t+'</button>'}
function riMetric(t,n,d){return '<div class="ri-card"><div class="ri-label">'+t+'</div><div class="ri-num">'+n+'</div><p>'+d+'</p></div>'}
function riHead(k,t,p){return '<div class="ri-kicker">'+k+'</div><h1>'+t+'</h1><p class="ri-intro">'+p+'</p>'}
function riSection(t,h=''){return '<div class="ri-section"><h2>'+t+'</h2><span>'+h+'</span></div>'}
function riAction(t){riActions.unshift(t);riRender();let n=document.getElementById('ri-action-status');if(n){n.textContent='Action staged: '+t+'. Demo only — nothing was sent.';n.hidden=false}}
function riChart(v,max){return '<div class="ri-chart">'+v.map((x,i)=>'<div class="ri-bar"><b>'+x[1]+'</b><i style="height:'+Math.max(3,x[1]/max*110)+'px;background:'+riColors[i%4]+'"></i><small>'+x[0]+'</small></div>').join('')+'</div>'}
function riData(kind){let rows=kind==='gym'?[['Attendance','Recent vs usual member check-ins','500 records'],['Class bookings','Booked, cancelled and missed sessions','500 records'],['Billing','Membership fees and payment issues','500 records'],['Member history','Tenure and previous pauses','500 records']]:[['Loan terms','Balances, rates and fixed-rate expiry','500 records'],['Customer enquiries','Refinance and discharge signals','500 records'],['Servicing','Complaints and unresolved issues','500 records'],['Repayment indicators','Arrears and financial pressure','500 records']];return '<div class="ri-card"><div class="ri-kicker">01 / Example data received</div><h3>What RetainIQ looks at</h3><p>These are fictional sample inputs, not data uploaded from a real system.</p>'+rows.map(x=>'<div class="ri-data"><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><span class="ri-chip green">'+x[2]+'</span></div>').join('')+'</div>'}
function riSuggestions(kind){let gym=kind==='gym',data=gym?[['68','members need attention','Attendance has fallen sharply','Create priority check-ins'],['104','members are drifting','Engagement is below their usual routine','Prepare re-engagement campaign'],['72','members may want more','Regular visits and class interest','Review relevant upgrades']]:[['54','borrowers may refinance','Rate expiry and refinance enquiries','Create specialist loan reviews'],['96','borrowers show early signals','Early pricing and service concerns','Schedule proactive check-ins'],['72','relevant product opportunities','Potential needs require suitability review','Prepare eligibility and consent review']];return '<div class="ri-grid three">'+data.map((x,i)=>'<div class="ri-card ri-tile"><span class="ri-chip '+['red','amber','green'][i]+'">'+['High priority','Early warning','Opportunity'][i]+'</span><div class="ri-num">'+x[0]+'</div><h3>'+x[1]+'</h3><p><b>Why:</b> '+x[2]+'</p><p><b>Recommended:</b> '+x[3]+'</p>'+riBtn('DO THIS →','riAction(\''+x[3]+' ('+x[0]+' cases)\')')+'</div>').join('')+'</div>'}
function riScore(kind){let mode=kind==='gym'?'gym':riMode,fs=riDefs[mode].map((x,i)=>{let key=mode+'-'+riCustomer+'-'+i;return {name:x[0],max:x[1],value:riTweaks[key]===undefined?Math.max(0,Math.min(x[1],x[2]+(riCustomer?((riCustomer*7+i*9)%15)-7:0))):riTweaks[key],key}}),total=fs.reduce((a,x)=>a+x.value,0),color=total>=70?'#e87e82':total>=40?'#eab65c':'#61c9a6',who=riCustomer===0?(kind==='gym'?'Emma Wilson':'Alex Morgan'):['Sophie Chen','Daniel Park','Mia Patel','Oliver James','Jamie Lee'][riCustomer-1];return (kind==='mortgage'?'<div style="display:flex;gap:9px;margin-bottom:15px;flex-wrap:wrap">'+riBtn('Refinancing risk','riMode=\'retention\';riRender()',riMode!=='retention')+riBtn('Repayment distress','riMode=\'distress\';riRender()',riMode!=='distress')+'</div>':'')+'<div class="ri-grid two"><div class="ri-card"><div class="ri-kicker">03 / Customer scorecard</div><h3>Who needs attention?</h3><select onchange="riCustomer=+this.value;riRender()">'+Array.from({length:6},(_,i)=>'<option value="'+i+'" '+(riCustomer===i?'selected':'')+'>'+(i===0?(kind==='gym'?'Emma Wilson':'Alex Morgan'):['Sophie Chen','Daniel Park','Mia Patel','Oliver James','Jamie Lee'][i-1])+'</option>').join('')+'</select><div class="ri-score"><div class="ri-ring" style="background:conic-gradient('+color+' '+total+'%,#eff0f6 '+total+'%)"><div>'+total+'</div></div><div><span class="ri-chip '+(total>=70?'red':total>=40?'amber':'green')+'">'+(total>=70?'High':total>=40?'Moderate':'Lower')+' indicator</span><h3>'+who+'</h3><p>Illustrative risk score out of 100, not a validated probability.</p></div></div><p><b>Recommended next step:</b> '+(mode==='distress'?'Offer a supportive hardship or repayment conversation.':kind==='gym'?'Arrange a personal member check-in.':'Arrange a proactive loan review with consent.')+'</p>'+riBtn('DO THIS →','riAction(\'Customer review: '+who+'\')')+'</div><div class="ri-card"><div class="ri-kicker">04 / Explain the score</div><h3>Why was this customer flagged?</h3><p>Move any slider to see how the score changes.</p>'+fs.map(f=>'<div class="ri-factor"><div class="ri-data"><b>'+f.name+'</b><b>'+f.value+' / '+f.max+'</b></div><div class="ri-track"><i style="width:'+f.value/f.max*100+'%"></i></div><input aria-label="'+f.name+'" type="range" min="0" max="'+f.max+'" value="'+f.value+'" oninput="riTweaks[\''+f.key+'\']=+this.value;riRender()"></div>').join('')+'</div></div>'}
function riLog(){return riActions.length?'<div class="ri-notice"><b>✓ Action staged:</b> '+riActions[0]+'<div>Saved in this demo session. No real messages or tasks were sent.</div></div>':''}
function riIndustry(kind){let gym=kind==='gym',v=gym?riGym:riMortgage;return riHead('Customer retention / '+(gym?'Gyms':'Mortgage'),gym?'Keep members coming back.':'Keep customers before they leave.',gym?'See attendance signals, understand why a member is drifting and take the next action in one click.':'See refinance and service signals, understand the risk and assign the right follow-up.')+'<div class="ri-grid">'+riMetric('Customers analysed','500','Synthetic member records')+riMetric('High priority',v[0],'Customers needing attention')+riMetric('Early warning',v[1],'Potential issues emerging')+riMetric('Actions staged',riActions.length,'Simulated actions this session')+'</div>'+riSection('Start with the evidence','The inputs and the pattern')+'<div class="ri-grid two">'+riData(kind)+'<div class="ri-card"><div class="ri-kicker">02 / Customer health</div><h3>Where attention is needed</h3><p>Four distinct segments across 500 fictional customers.</p>'+riChart([['At risk',v[0]],['Watch',v[1]],['Healthy',v[2]],['Growth',v[3]]],300)+'</div></div>'+riSection('What should you do next?','Clear recommendations · One click')+riSuggestions(kind)+riLog()+riSection('Explore a real example','Adjustable scorecards')+riScore(kind)+'<p style="margin-top:20px">All inputs, scores, segments and outcomes are illustrative. Mortgage repayment distress is separate from refinancing risk and should trigger appropriate customer support, never an automatic credit decision.</p>'}
function riOverview(){return riHead('Welcome to RetainIQ','Know what matters. Do what works.','One calm place to understand your customers, spot what matters and take the next step. No noise. Just clarity.')+'<div class="ri-grid">'+riMetric('Customers analysed','1,000','500 gym + 500 mortgage')+riMetric('High-priority cases','122','68 gym + 54 mortgage')+riMetric('Early warnings','200','Across both industries')+riMetric('Actions staged',riActions.length,'This demo session')+'</div>'+riSection('Choose what you want to solve','Explore the interactive demos')+'<div class="ri-grid three">'+[['♧','Gym retention','Help members who are drifting away',1],['⌂','Mortgage retention','Identify refinancing risk before discharge',2],['◈','Experience optimisation','Find where digital journeys lose customers',3]].map(x=>'<div class="ri-card ri-tile"><div class="ri-num">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p>'+riBtn('Explore →','riGo('+x[3]+')')+'</div>').join('')+'</div>'+riSection('A simpler way to work')+'<div class="ri-steps">'+[['01','See the data'],['02','Understand the score'],['03','Get a recommendation'],['04','Click DO THIS']].map(x=>'<div class="ri-card"><b>'+x[0]+'</b><h3>'+x[1]+'</h3></div>').join('')+'</div>'+riLog()}
function riExperience(){return riHead('Experience optimisation','Find friction. Fix the journey.','Explore a fictional mortgage application funnel, identify where customers drop off and stage an experiment.')+'<div class="ri-grid">'+riMetric('Applications started','1,000','Fictional sample')+riMetric('Completed','410','Current illustrative flow')+riMetric('Completion rate','41%','Example baseline')+riMetric('Target scenario','52%','Not a measured result')+'</div>'+riSection('What the journey shows')+'<div class="ri-grid two"><div class="ri-card"><h3>Application funnel</h3>'+riChart([['Start',1000],['Details',810],['Documents',540],['Complete',410]],1000)+'<p>Document upload is a candidate friction point.</p></div><div class="ri-card"><span class="ri-chip amber">Suggested improvement</span><h3>Make document upload easier</h3><p>Clarify required documents, enable camera upload and let customers save progress.</p><div class="ri-data"><b>Current completion</b><b>41%</b></div><div class="ri-data"><b>Hypothetical target</b><b>52%</b></div><p>Potential additional completions: 110 per 1,000 starts, if the target were achieved.</p>'+riBtn('DO THIS → Stage UX test','riAction(\'Create document-upload UX experiment\')')+'</div></div>'+riLog()}
function riHealth(){let after=riIncome-riCosts-riBill;return riHead('Financial health','Understand the pressure. Offer support.','Change the example household numbers to see how financial pressure changes the recommended action.')+'<div class="ri-grid">'+riMetric('Monthly income','$'+riIncome,'Fictional income')+riMetric('Essential costs','$'+riCosts,'Monthly obligations')+riMetric('Unexpected bill','$'+riBill,'One-off expense')+riMetric('Remaining buffer','$'+after,'After the expense')+'</div>'+riSection('Explore the financial signals')+'<div class="ri-grid two"><div class="ri-card">'+[['riIncome','Monthly income',1200,12000],['riCosts','Essential costs',500,10000],['riBill','Unexpected expense',0,8000]].map(x=>'<div class="ri-factor"><div class="ri-data"><b>'+x[1]+'</b><b>$'+eval(x[0])+'</b></div><input type="range" min="'+x[2]+'" max="'+x[3]+'" step="100" value="'+eval(x[0])+'" oninput="'+x[0]+'=+this.value;riRender()"></div>').join('')+'</div><div class="ri-card"><h3>Cash-flow snapshot</h3>'+riChart([['Income',riIncome],['Costs',riCosts],['Bill',riBill],['Left',Math.max(0,after)]],12000)+'<p>'+(after<0?'Potential shortfall: offer supportive options.':after<500?'Limited buffer: consider a wellbeing check-in.':'Positive buffer: monitor for changes.')+'</p>'+riBtn('DO THIS → '+(after<500?'Offer support':'Schedule monitoring'),'riAction(\'Financial wellbeing review\')')+'</div></div>'+riLog()}
function riGrowth(){return riHead('Growth intelligence','Find opportunities that make sense.','Use customer behaviour to identify relevant opportunities, then review suitability and consent before contacting anyone.')+'<div class="ri-grid">'+riMetric('Gym opportunities','72','Engaged members')+riMetric('Mortgage opportunities','72','Potential customer needs')+riMetric('Total','144','Fictional opportunities')+riMetric('Actions staged',riActions.length,'Demo only')+'</div>'+riSection('Suggested next actions')+'<div class="ri-grid two"><div class="ri-card ri-tile"><h3>Gym: relevant training offers</h3><p>Signals: frequent visits, class bookings and membership tenure.</p>'+riBtn('DO THIS → Review 72 members','riAction(\'Review gym opportunities\')')+'</div><div class="ri-card ri-tile"><h3>Mortgage: product suitability review</h3><p>Signals: loan structure and customer-initiated needs. Check eligibility and consent first.</p>'+riBtn('DO THIS → Review 72 borrowers','riAction(\'Review mortgage opportunities\')')+'</div></div>'+riLog()}
function riHow(){return riHead('How it works','Clear data. Clear decisions.','The demonstration uses synthetic information. A production platform would need secure integrations and validated models.')+'<div class="ri-grid two">'+[['01','Connect systems','Gym CRM, billing, loan servicing and analytics data'],['02','Explain signals','Transform authorised metrics into readable, validated indicators'],['03','Suggest actions','Present a reason, priority and appropriate next step'],['04','Measure outcomes','Send approved actions and verify real results']].map(x=>'<div class="ri-card"><div class="ri-kicker">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div>').join('')+'</div>'}
function riGo(i){riTab=i;riCustomer=0;riRender();window.scrollTo(0,0)}
function riRender(){document.getElementById('ri-links').innerHTML=riNames.map((x,i)=>'<button class="'+(riTab===i?'on':'')+'" onclick="riGo('+i+')">'+x+'</button>').join('');document.getElementById('ri-crumb').textContent=riNames[riTab];document.getElementById('ri-content').innerHTML=[riOverview,()=>riIndustry('gym'),()=>riIndustry('mortgage'),riExperience,riHealth,riGrowth,riHow][riTab]()}
riRender();
</script></body></html>
