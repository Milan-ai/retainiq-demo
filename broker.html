<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetainIQ Broker</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202b37;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}aside{width:235px;flex:none;background:#fff;border-right:1px solid #e7ebef;padding:28px 15px;position:sticky;top:0;height:100vh}.logo{font-weight:850;font-size:25px;letter-spacing:-1.2px;margin:0 12px 5px}.logo span{color:#3978cf}.tag{font-size:10px;letter-spacing:1.3px;color:#9ba8b5;font-weight:750;margin:0 12px 32px}nav button{border:0;background:transparent;color:#69798b;text-align:left;display:block;width:100%;border-radius:10px;padding:13px;font-size:12px;font-weight:650;margin:3px 0}nav button.active{background:#eaf2ff;color:#2863b4}nav button:hover{background:#f1f5fb}.asidefoot{position:absolute;bottom:24px;left:28px;right:20px;font-size:11px;color:#91a0ae;line-height:1.8}main{padding:38px 43px 75px;max-width:1400px;width:100%;margin:auto;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:37px}.tiny{font-size:10px;color:#8b9aab;letter-spacing:1.1px;font-weight:800}.muted{color:#8593a2;font-size:12px;line-height:1.6}.hero h1{font-size:clamp(31px,4vw,47px);letter-spacing:-1.9px;margin:10px 0}.hero p{color:#8391a0;font-size:14px;margin:0 0 25px;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.metric,.card{background:white;border:1px solid #e8edf2;border-radius:18px;padding:21px}.metric b{display:block;font-size:31px;letter-spacing:-1.1px;margin:11px 0 5px}.metric small{font-size:11px;color:#8c9aa8}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:17px}.section{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;gap:15px}.section h2{font-size:20px;letter-spacing:-.6px;margin:0}.card h2{font-size:19px;margin:4px 0 14px}.card h3{font-size:14px}.line{border-bottom:1px solid #edf1f5;padding:15px 0;display:flex;justify-content:space-between;align-items:center;gap:13px}.line:last-child{border:0}.line b{font-size:12px}.line p{font-size:11px;color:#8796a5;margin:5px 0}.btn{background:#2e6cbd;color:white;border:0;border-radius:30px;padding:10px 15px;font-size:11px;font-weight:750;white-space:nowrap}.btn:hover{background:#1f5295}.btn.alt{background:#edf3fc;color:#2c69b6}.btn.light{background:#f0f3f6;color:#5c7084}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #91b9ef;outline-offset:2px}.pill{font-size:10px;padding:5px 9px;border-radius:30px;font-weight:800;display:inline-block;background:#e8f3ec;color:#337c54}.pill.red{background:#fff0ea;color:#b95e40}.pill.amber{background:#fff6e2;color:#a07828}.tbl{width:100%;border-collapse:collapse;min-width:740px}.tbl th{text-align:left;font-size:10px;color:#93a1af;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #edf1f5;padding:12px 10px}.tbl td{font-size:12px;padding:13px 10px;border-bottom:1px solid #f0f2f5}.tbl td small{display:block;color:#9ba7b4;margin-top:4px}.tablewrap{overflow:auto}.control{width:100%;border:1px solid #dfe7f0;border-radius:10px;padding:11px 12px;background:#fff;color:#26384a}.field{display:block;font-size:11px;font-weight:750;color:#6b7f90;margin:15px 0 6px}textarea.control{min-height:150px;resize:vertical;line-height:1.7}.notice{background:#edf5ff;color:#456e9e;border:1px solid #dceaf9;border-radius:12px;padding:14px;font-size:12px;line-height:1.7;margin:16px 0}.warning{background:#fff8e9;border-color:#f3e5c4;color:#886b35}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{height:9px;border-radius:10px;background:#ecf1f8;overflow:hidden}.bar i{height:100%;background:#4787d4;display:block}.mobile{display:none}.empty{text-align:center;color:#92a1af;padding:30px}.toast{position:fixed;right:20px;bottom:20px;background:#24394e;color:white;padding:14px 18px;border-radius:12px;font-size:12px;z-index:10}@media(max-width:1000px){aside{width:195px}main{padding:25px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{display:none}.mobile{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;position:sticky;top:0;z-index:4}.mobile button{border:0;border-radius:20px;background:#eff4fb;padding:10px 12px;white-space:nowrap;font-size:11px}.mobile button.active{background:#2e6cbd;color:#fff}main{padding:23px 15px 60px}.grid,.cols{grid-template-columns:1fr}.metric{padding:15px}.metric b{font-size:25px}.card{padding:17px}}
</style></head><body><div id="mobile" class="mobile"></div><div class="layout"><aside><div class="logo">retain<span>IQ</span></div><div class="tag">BROKER INTELLIGENCE</div><nav id="nav"></nav><div class="asidefoot">● Interactive fictional portfolio<br>Saved locally in your browser<br>No live lender or messaging connections</div></aside><main><div class="top"><div class="tiny">RETAINIQ / BROKER WORKSPACE</div><div style="font-size:12px;color:#7b8a9a">Demo environment · AU</div></div><div id="app"></div></main></div><div id="toast" class="toast" hidden></div><script>
const initial=[
{id:'B101',name:'Olivia Harper',balance:725000,rate:6.19,term:'Variable',expiry:0,months:31,review:14,contact:true,trail:.0015,stage:'Settled'},
{id:'B102',name:'Noah Williams',balance:540000,rate:5.95,term:'Fixed',expiry:42,months:19,review:40,contact:true,trail:.0015,stage:'Settled'},
{id:'B103',name:'Ava Singh',balance:920000,rate:6.45,term:'Variable',expiry:0,months:37,review:10,contact:true,trail:.0015,stage:'Settled'},
{id:'B104',name:'Liam Chen',balance:410000,rate:5.69,term:'Fixed',expiry:78,months:22,review:90,contact:false,trail:.0015,stage:'Settled'},
{id:'B105',name:'Mia Thompson',balance:630000,rate:6.29,term:'Variable',expiry:0,months:14,review:3,contact:true,trail:.0015,stage:'Settled'},
{id:'B106',name:'Ethan Patel',balance:880000,rate:5.79,term:'Fixed',expiry:24,months:45,review:25,contact:true,trail:.0015,stage:'Settled'},
{id:'B107',name:'Grace Martin',balance:390000,rate:6.09,term:'Variable',expiry:0,months:55,review:0,contact:true,trail:.0015,stage:'Settled'},
{id:'B108',name:'Leo Brown',balance:1080000,rate:5.99,term:'Fixed',expiry:110,months:27,review:115,contact:true,trail:.0015,stage:'Settled'},
{id:'B109',name:'Chloe Nguyen',balance:470000,rate:6.39,term:'Variable',expiry:0,months:44,review:21,contact:true,trail:.0015,stage:'Settled'},
{id:'B110',name:'Jack Roberts',balance:790000,rate:5.89,term:'Fixed',expiry:15,months:34,review:8,contact:true,trail:.0015,stage:'Settled'}];
const seedDeals=[
{id:'D01',client:'Olivia Harper',stage:'Documents',missing:'Payslips and liabilities',owner:'Sarah',status:'Open'},
{id:'D02',client:'Ava Singh',stage:'Lender assessment',missing:'Lender follow-up',owner:'Sarah',status:'Open'},
{id:'D03',client:'Mia Thompson',stage:'Pre-approval',missing:'Identification verification',owner:'James',status:'Open'},
{id:'D04',client:'Ethan Patel',stage:'Settlement',missing:'Confirm settlement date',owner:'James',status:'Open'}];
let state;try{state=JSON.parse(localStorage.getItem('retainIQ-broker-v1'))}catch(e){}if(!state||!Array.isArray(state.clients))state={clients:structuredClone(initial),deals:structuredClone(seedDeals),tasks:[],drafts:[],events:[],next:1};let page='overview',focus=null,rateShift=0,selected=[],draft=null;
const menu=[['overview','Overview'],['book','Client book'],['opportunities','Opportunity engine'],['rates','Rate simulator'],['pipeline','Loan pipeline'],['outreach','Client outreach'],['tasks','Action centre'],['reports','Revenue & reports'],['settings','Data & settings']];
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n),save=()=>{try{localStorage.setItem('retainIQ-broker-v1',JSON.stringify(state))}catch(e){}};function log(type,detail){state.events.unshift({at:new Date().toLocaleString('en-AU'),type,detail});save()}function toast(msg){let e=$('toast');e.textContent=msg;e.hidden=false;setTimeout(()=>e.hidden=true,3200)}
function btn(label,fn,variant=''){return '<button class="btn '+variant+'" onclick="'+fn+'">'+label+'</button>'}function pill(s){return '<span class="pill '+(/Urgent|At risk|Overdue|Open/.test(s)?'red':/Watch|Review|Pending/.test(s)?'amber':'')+'">'+esc(s)+'</span>'}function head(k,t,sub){return '<div class="hero"><div class="tiny">'+k+'</div><h1>'+t+'</h1><p>'+sub+'</p></div>'}function metric(k,v,n=''){return '<div class="metric"><small>'+k+'</small><b>'+v+'</b><small>'+n+'</small></div>'}function section(t,s=''){return '<div class="section"><h2>'+t+'</h2><span class="muted">'+s+'</span></div>'}function nav(p){page=p;focus=null;draft=null;selected=[];render();window.scrollTo(0,0)}
function risk(c,delta=0){let review=c.review<=30,expiry=c.term==='Fixed'&&c.expiry<=90,high=c.term==='Variable'&&c.rate+delta>=6.3;return expiry||high?'Urgent':review||c.rate+delta>=6.1?'Watch':'On track'}
function reason(c,delta=0){let parts=[];if(c.term==='Fixed'&&c.expiry<=90)parts.push('Fixed-rate expiry in '+c.expiry+' days');if(c.review<=30)parts.push('Review due in '+c.review+' days');if(c.term==='Variable'&&c.rate+delta>=6.3)parts.push('Rate review signal at '+(c.rate+delta).toFixed(2)+'%');return parts.join(' · ')||'Routine client check-in'}
function priority(){return [...state.clients].sort((a,b)=>({Urgent:0,Watch:1,'On track':2}[risk(a)]-({Urgent:0,Watch:1,'On track':2}[risk(b)]))||a.review-b.review)}
function render(){let n=menu.map(([id,label])=>'<button class="'+(page===id?'active':'')+'" onclick="nav(\''+id+'\')">'+label+'</button>').join('');$('nav').innerHTML=n;$('mobile').innerHTML=n;$('app').innerHTML=({overview,book,opportunities,rates,pipeline,outreach,tasks,reports,settings})[page]()}
function overview(){let p=priority(),urgent=p.filter(c=>risk(c)==='Urgent'),due=p.filter(c=>c.review<=30),fixed=p.filter(c=>c.term==='Fixed'&&c.expiry<=90);return head('THE WORK THAT MOVES YOUR BUSINESS','Your book. Your next move.','One place to find clients who need attention, act on the right opportunities and record outcomes.')+'<div class="metrics">'+metric('Clients requiring review',urgent.length+due.filter(c=>!urgent.includes(c)).length,'Signals, not loan recommendations')+metric('Fixed expiries ≤ 90 days',fixed.length,'Client reviews to schedule')+metric('Loan book value',money(state.clients.reduce((s,c)=>s+c.balance,0)),'Fictional portfolio')+metric('Open actions',state.tasks.filter(t=>t.status!=='Completed').length,'Owned and tracked')+'</div>'+section('Start here','Priority recommendations')+'<div class="grid"><div class="card">'+p.slice(0,5).map(c=>'<div class="line"><div><b>'+esc(c.name)+'</b> '+pill(risk(c))+'<p>'+esc(reason(c))+'</p></div>'+btn('Review client →','openClient(\''+c.id+'\')')+'</div>').join('')+'</div><div class="card"><h2>Pipeline bottlenecks</h2>'+state.deals.filter(d=>d.status!=='Completed').slice(0,4).map(d=>'<div class="line"><div><b>'+esc(d.client)+'</b><p>'+esc(d.stage)+' · '+esc(d.missing)+'</p></div>'+btn('Resolve →','openDeal(\''+d.id+'\')','alt')+'</div>').join('')+btn('View loan pipeline →','nav(\'pipeline\')','alt')+'</div></div>'+section('One client book. More proactive service.')+'<div class="grid"><div class="card"><h2>Review before recommending</h2><p class="muted">Alerts help identify when a client may benefit from a conversation. Any credit recommendation requires appropriate fact-finding, suitability assessment and best interests consideration.</p>'+btn('Explore opportunities →','nav(\'opportunities\')')</div><div class="card"><h2>Rate-change intelligence</h2><p class="muted">Change a hypothetical rate assumption and see exactly which clients move between attention categories.</p>'+btn('Open simulator →','nav(\'rates\')','alt')+'</div></div>'+notice()}
function notice(){return '<div class="notice warning"><b>Fictional demonstration:</b> All initial client records and rates are illustrative. No lender rates, CRM, banking, SMS or email services are connected. No messages are sent and no credit recommendations are generated.</div>'}
function table(list){return '<div class="tablewrap"><table class="tbl"><thead><tr><th>Client</th><th>Loan balance</th><th>Rate</th><th>Product</th><th>Next review</th><th>Signal</th><th>Action</th></tr></thead><tbody>'+list.map(c=>'<tr><td><b>'+esc(c.name)+'</b><small>'+c.id+'</small></td><td>'+money(c.balance)+'</td><td>'+(c.rate+rateShift).toFixed(2)+'%</td><td>'+c.term+(c.term==='Fixed'?'<small>'+c.expiry+' days to expiry</small>':'')+'</td><td>'+c.review+' days</td><td>'+pill(risk(c,rateShift))+'</td><td>'+btn('Open →','openClient(\''+c.id+'\')','alt')+'</td></tr>').join('')+'</tbody></table></div>'}
function book(){if(focus)return clientDetail();return head('A CONNECTED CLIENT BOOK','Know every client.','Review balances, product terms, milestones and opportunities across your portfolio.')+'<div class="card">'+table(state.clients)+'</div>'+section('Add a fictional client')+'<div class="card"><div class="cols"><div><label class="field">Client name</label><input class="control" id="newname" placeholder="Sample client"><label class="field">Loan balance</label><input type="number" class="control" id="newbalance" value="500000"><label class="field">Interest rate (%)</label><input type="number" step=".01" class="control" id="newrate" value="6.10"></div><div><label class="field">Product</label><select id="newterm" class="control"><option>Variable</option><option>Fixed</option></select><label class="field">Days to next review</label><input type="number" id="newreview" class="control" value="30"><label class="field">Days to fixed expiry (if applicable)</label><input type="number" id="newexpiry" class="control" value="90"></div></div><div class="actions" style="margin-top:17px">'+btn('Add sample client','addClient()')+'</div></div>'}
function addClient(){let name=$('newname').value.trim(),balance=+$('newbalance').value,rate=+$('newrate').value,review=+$('newreview').value,expiry=+$('newexpiry').value;if(!name||balance<=0||rate<=0||rate>30||review<0||expiry<0){toast('Enter valid client details');return}let id='B'+(200+state.next++);state.clients.push({id,name,balance,rate,term:$('newterm').value,expiry,review,months:30,contact:false,trail:.0015,stage:'Settled'});log('Client added',id+' · '+name);render();toast('Sample client added')}
function openClient(id){page='book';focus=id;render();window.scrollTo(0,0)}
function clientDetail(){let c=state.clients.find(x=>x.id===focus);if(!c){focus=null;return book()}let monthly=c.balance*(c.rate/100)/12,annualTrail=c.balance*c.trail;return btn('← Back to client book','focus=null;render()','light')+head('CLIENT / '+c.id,esc(c.name),'Client overview, review signals and next best administrative actions.')+'<div class="metrics">'+metric('Loan balance',money(c.balance))+metric('Current rate',c.rate.toFixed(2)+'%')+metric('Interest-only monthly illustration',money(monthly),'Not an actual repayment')+metric('Illustrative annual trail',money(annualTrail),'Assumed 0.15% p.a.')+'</div><div class="grid"><div class="card"><h2>Why this client is flagged</h2><p>'+pill(risk(c))+'</p><p class="muted">'+esc(reason(c))+'</p><div class="notice">A flag means a review conversation may be appropriate. It does not establish that refinancing is suitable or in the client's best interests.</div>'+btn('Create mortgage review task →','createTask(\'Mortgage review\',\''+c.id+'\',\'Verify needs, circumstances, current loan details and review options\')')+'</div><div class="card"><h2>Contact and follow-up</h2><p class="muted">Fictional communication permission: '+(c.contact?'Yes':'Not confirmed')+'</p>'+btn('Prepare client update →','prepare(\''+c.id+'\')','alt')+'<p class="muted">Communications are drafts only. Verify client contact details, consent and channel preferences before real outreach.</p></div></div>'}
function opportunities(){let list=priority().filter(c=>risk(c)!=='On track');let trail=list.reduce((s,c)=>s+c.balance*c.trail,0);return head('PROACTIVE SERVICE','Opportunity engine','Prioritise review conversations using transparent, editable client data.')+'<div class="metrics">'+metric('Clients to review',list.length)+metric('Associated loan balances',money(list.reduce((s,c)=>s+c.balance,0)))+metric('Illustrative annual trail',money(trail),'Assumed 0.15% p.a.; not at-risk forecast')+metric('Reviews booked',state.tasks.filter(t=>t.status==='Completed'&&t.type==='Mortgage review').length)+'</div><div class="card">'+list.map(c=>'<div class="line"><div><b>'+esc(c.name)+'</b> '+pill(risk(c))+'<p>'+esc(reason(c))+' · '+money(c.balance)+'</p></div>'+btn('Start review →','openClient(\''+c.id+'\')')+'</div>').join('')+'</div>'+notice()}
function rates(){let before=state.clients.map(c=>risk(c,0)),after=state.clients.map(c=>risk(c,rateShift)),moved=state.clients.filter((c,i)=>before[i]!==after[i]);return head('UNDERSTAND CHANGE','Rate-change simulator','Explore hypothetical changes in variable-rate pricing and see exactly how client attention statuses move.')+'<div class="card"><div class="cols"><div><h2>Model a rate movement</h2><p class="muted">Illustrative adjustment applied to the displayed rate. Fixed-rate expiries and review dates are unchanged.</p><label class="field">Rate adjustment</label><input style="width:100%;accent-color:#3676c7" type="range" min="-1.5" max="1.5" step=".05" value="'+rateShift+'" oninput="rateShift=+this.value;document.getElementById(\'ratevalue\').textContent=(rateShift>=0?\'+\':\'\')+rateShift.toFixed(2)+\'%\';document.getElementById(\'scenarioresults\').innerHTML=scenarioResults()"></div><div class="metric" style="background:#f3f7fd"><small>Hypothetical rate change</small><b id="ratevalue">'+(rateShift>=0?'+':'')+rateShift.toFixed(2)+'%</b><small>Compared with sample baseline</small></div></div></div><div id="scenarioresults">'+scenarioResults()+'</div>'}
function scenarioResults(){let statuses=['On track','Watch','Urgent'],moved=state.clients.filter(c=>risk(c)!==risk(c,rateShift));return '<div class="metrics">'+metric('Urgent after change',state.clients.filter(c=>risk(c,rateShift)==='Urgent').length)+metric('Watch after change',state.clients.filter(c=>risk(c,rateShift)==='Watch').length)+metric('Moved status',moved.length)+metric('Clients modelled',state.clients.length)+'</div>'+section('Status movement','Before → after')+'<div class="card"><div class="tablewrap"><table class="tbl"><thead><tr><th>Before ↓ / After →</th>'+statuses.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+statuses.map(a=>'<tr><td><b>'+a+'</b></td>'+statuses.map(b=>'<td>'+state.clients.filter(c=>risk(c)===a&&risk(c,rateShift)===b).length+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'+section('Clients crossing a threshold')+'<div class="card">'+(moved.length?moved.map(c=>'<div class="line"><div><b>'+esc(c.name)+'</b><p>'+risk(c)+' → '+risk(c,rateShift)+' · '+c.rate.toFixed(2)+'% → '+(c.rate+rateShift).toFixed(2)+'%</p></div>'+btn('Review →','openClient(\''+c.id+'\')','alt')+'</div>').join(''):'<div class="empty">No clients cross a status threshold in this scenario.</div>')+'</div>'+notice()}
function pipeline(){if(focus)return dealDetail();return head('FROM APPLICATION TO SETTLEMENT','Loan pipeline','Find missing documents, lender follow-ups and stalled applications.')+'<div class="metrics">'+metric('Open applications',state.deals.filter(d=>d.status!=='Completed').length)+metric('Resolved bottlenecks',state.deals.filter(d=>d.status==='Completed').length)+metric('Tasks created',state.tasks.length)+metric('External lender integrations','0','Not connected')+'</div><div class="card">'+state.deals.map(d=>'<div class="line"><div><b>'+esc(d.client)+'</b> '+pill(d.status)+'<p>'+esc(d.stage)+' · '+esc(d.missing)+' · '+esc(d.owner)+'</p></div>'+btn('Open →','openDeal(\''+d.id+'\')','alt')+'</div>').join('')+'</div>'}
function openDeal(id){page='pipeline';focus=id;render();window.scrollTo(0,0)}
function dealDetail(){let d=state.deals.find(x=>x.id===focus);if(!d)return pipeline();return btn('← Pipeline','focus=null;render()','light')+head('APPLICATION / '+d.id,esc(d.client),'Move this file forward with clear ownership and documented next steps.')+'<div class="card"><h2>'+esc(d.stage)+'</h2><p class="muted">Outstanding: '+esc(d.missing)+'</p><label class="field">Assigned owner</label><input id="owner" class="control" value="'+esc(d.owner)+'"><label class="field">Action notes</label><textarea id="dealnote" class="control" placeholder="Record the next step or outcome."></textarea><div class="actions" style="margin-top:17px">'+btn('Save follow-up →','dealSave(false)')+btn('Mark bottleneck resolved →','dealSave(true)','alt')+'</div></div>'}
function dealSave(done){let d=state.deals.find(x=>x.id===focus),note=$('dealnote').value.trim();if(done&&!note){toast('Enter a resolution note');return}d.owner=$('owner').value.trim()||'Unassigned';d.status=done?'Completed':'In progress';log(done?'Bottleneck resolved':'Pipeline updated',d.id+' · '+note);focus=null;render();toast('Pipeline updated')}
function createTask(type,subject,detail){let id='T'+String(state.next++).padStart(4,'0');state.tasks.unshift({id,type,subject,detail,status:'Open',owner:'Unassigned',outcome:'',created:new Date().toLocaleDateString('en-AU')});log('Task created',id+' · '+type+' · '+subject);page='tasks';focus=null;render();toast('Task created')}
function tasks(){return head('NO MORE LOST FOLLOW-UPS','Action centre','Every client action has a clear status and recorded outcome.')+'<div class="metrics">'+metric('Open',state.tasks.filter(t=>t.status!=='Completed').length)+metric('Completed',state.tasks.filter(t=>t.status==='Completed').length)+metric('Pipeline resolutions',state.deals.filter(d=>d.status==='Completed').length)+metric('Outreach drafts',state.drafts.length)+'</div><div class="card">'+(state.tasks.length?state.tasks.map(t=>'<div class="line"><div><b>'+esc(t.type)+' · '+esc(t.subject)+'</b> '+pill(t.status)+'<p>'+esc(t.detail)+' · '+esc(t.owner)+(t.outcome?' · '+esc(t.outcome):'')+'</p></div>'+(t.status==='Completed'?'':btn('Record outcome →','finish(\''+t.id+'\')','alt'))+'</div>').join(''):'<div class="empty">No actions yet. Open a client review or opportunity to create a task.</div>')+'</div>'+section('Audit activity')+'<div class="card">'+(state.events.length?state.events.slice(0,20).map(e=>'<div class="line"><div><b>'+esc(e.type)+'</b><p>'+esc(e.detail)+'</p></div><span class="muted">'+esc(e.at)+'</span></div>').join(''):'<div class="empty">Recorded actions will appear here.</div>')+'</div>'}
function finish(id){let t=state.tasks.find(x=>x.id===id),outcome=prompt('Record outcome (e.g. review booked, completed, follow-up required):');if(!outcome?.trim())return;t.outcome=outcome.trim();t.status='Completed';log('Task completed',id+' · '+t.outcome);render();toast('Outcome recorded')}
function prepare(id){page='outreach';selected=[id];draft={step:0,channel:'Email',text:template('Email')};render();window.scrollTo(0,0)}
function template(ch){return ch==='SMS'?'Hi {{first_name}}, it may be time for your regular home loan check-in. Please contact our office if you would like to arrange a review.':'Subject: Your home loan check-in\n\nHi {{first_name}},\n\nWe would like to offer a routine review of your current home loan and goals. If you would like to arrange a time, please get in touch.\n\nKind regards,\nYour mortgage broker'}
function selectClient(id,on){if(on&&!selected.includes(id))selected.push(id);if(!on)selected=selected.filter(x=>x!==id)}
function selectAll(on){selected=on?state.clients.map(c=>c.id):[];render()}
function startDraft(){if(!selected.length){toast('Select clients first');return}draft={step:0,channel:'Email',text:template('Email')};render()}
function channel(ch){draft.channel=ch;draft.text=template(ch);render()}
function draftNext(){if(draft.step===1){draft.text=$('message').value;if(!draft.text.trim()){toast('Write a message first');return}}draft.step++;render()}
function approveDraft(){if(!$('approve')?.checked){toast('Confirm draft-only approval');return}let clients=state.clients.filter(c=>selected.includes(c.id)),eligible=clients.filter(c=>c.contact),id='C'+String(state.next++).padStart(4,'0');state.drafts.unshift({id,channel:draft.channel,text:draft.text,eligible:eligible.length,excluded:clients.length-eligible.length,at:new Date().toLocaleString('en-AU'),status:'Prepared, not sent'});log('Outreach draft prepared',id+' · '+eligible.length+' eligible · '+(clients.length-eligible.length)+' excluded');draft.step=3;draft.id=id;save();render()}
function outreach(){if(draft)return draftView();return head('THOUGHTFUL CLIENT COMMUNICATION','Client outreach','Prepare personalised review messages with an approval step. No actual messages are sent.')+'<div class="card"><h2>Select clients</h2><div class="actions">'+btn('Select all','selectAll(true)','alt')+btn('Clear','selectAll(false)','light')+btn('Prepare outreach →','startDraft()')+'</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Select</th><th>Client</th><th>Reason</th><th>Fictional permission</th></tr></thead><tbody>'+state.clients.map(c=>'<tr><td><input type="checkbox" '+(selected.includes(c.id)?'checked':'')+' aria-label="Select '+esc(c.name)+'" onchange="selectClient(\''+c.id+'\',this.checked)"></td><td>'+esc(c.name)+'</td><td>'+esc(reason(c))+'</td><td>'+pill(c.contact?'Demo yes':'Not confirmed')+'</td></tr>').join('')+'</tbody></table></div></div>'+section('Prepared communications')+'<div class="card">'+(state.drafts.length?state.drafts.map(d=>'<div class="line"><div><b>'+d.id+' · '+d.channel+'</b><p>'+d.eligible+' eligible · '+d.excluded+' excluded · '+d.at+'</p></div>'+pill(d.status)+'</div>').join(''):'<div class="empty">No communication drafts yet.</div>')+'</div>'}
function draftView(){let people=state.clients.filter(c=>selected.includes(c.id)),eligible=people.filter(c=>c.contact),s=draft.step;let body='';if(s===0)body='<div class="metrics">'+metric('Selected',people.length)+metric('Eligible',eligible.length)+metric('Excluded',people.length-eligible.length)+metric('Messages sent','0')+'</div><h3>Choose a channel</h3><div class="actions">'+['Email','SMS','Call'].map(c=>btn(c,'channel(\''+c+'\')',draft.channel===c?'':'alt')).join('')+'</div>'+notice()+btn('Continue →','draftNext()');if(s===1)body='<label class="field">Editable message template</label><textarea id="message" class="control">'+esc(draft.text)+'</textarea><label class="field">First-recipient preview</label><div class="notice" style="white-space:pre-wrap">'+esc(draft.text.replaceAll('{{first_name}}',eligible[0]?.name.split(' ')[0]||'Client'))+'</div><div class="actions">'+btn('← Back','draft.step--;render()','alt')+btn('Review →','draftNext()')+'</div>';if(s===2)body='<div class="metrics">'+metric('Selected',people.length)+metric('Eligible',eligible.length)+metric('Excluded',people.length-eligible.length)+metric('Real sends','0')+'</div><div class="notice" style="white-space:pre-wrap">'+esc(draft.text)+'</div><div class="notice warning">This action creates a local draft record only. Client identity, consent and contact preferences are not verified. No emails, SMS or calls will be sent.</div><label class="field"><input type="checkbox" id="approve"> I understand this is a simulated draft.</label><div class="actions">'+btn('← Edit','draft.step--;render()','alt')+btn('Create draft record →','approveDraft()')+'</div>';if(s===3)body='<div class="notice"><b>Draft '+draft.id+' prepared.</b> It has been recorded locally. No external messages were sent.</div>'+btn('Return to outreach','draft=null;selected=[];render()');return head('OUTREACH / STEP '+(s+1),['Choose a channel','Personalise message','Review and approve','Draft prepared'][s],eligible.length+' eligible of '+people.length+' selected clients')+'<div class="card">'+body+'</div>'}
function reports(){let completed=state.tasks.filter(t=>t.status==='Completed'),total=state.clients.reduce((s,c)=>s+c.balance,0),trail=state.clients.reduce((s,c)=>s+c.balance*c.trail,0);return head('PROVE THE WORK','Revenue & activity','Track portfolio metrics separately from verified business outcomes.')+'<div class="metrics">'+metric('Illustrative book value',money(total))+metric('Illustrative annual trail',money(trail),'Assumed 0.15% p.a.')+metric('Tasks completed',completed.length)+metric('Outreach drafts',state.drafts.length,'Not sent')+'</div><div class="grid"><div class="card"><h2>Actions recorded</h2>'+[['Tasks created',state.tasks.length],['Tasks completed',completed.length],['Pipeline bottlenecks resolved',state.deals.filter(d=>d.status==='Completed').length],['Communication drafts prepared',state.drafts.length]].map(x=>'<div class="line"><b>'+x[0]+'</b><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><h2>Revenue and compliance reality</h2><p class="muted">Loan balances and trail rates are fictional. Actual revenue, commission retention, refinancing suitability, settlements and staff time saved are not measured by this prototype.</p><div class="notice warning">Broker remuneration must not drive unsuitable credit recommendations. The platform flags review opportunities; it does not determine the best loan.</div></div></div>'+section('Export activity')+'<div class="actions">'+btn('Download task CSV','exportTasks()')+btn('Download audit CSV','exportEvents()','alt')+'</div>'}
function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function download(name,content){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type:'text/csv'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportTasks(){download('retainiq-broker-tasks.csv',[['ID','Type','Subject','Details','Status','Outcome'],...state.tasks.map(t=>[t.id,t.type,t.subject,t.detail,t.status,t.outcome])].map(r=>r.map(csv).join(',')).join('\n'))}
function exportEvents(){download('retainiq-broker-activity.csv',[['Date','Type','Details'],...state.events.map(e=>[e.at,e.type,e.detail])].map(r=>r.map(csv).join(',')).join('\n'))}
function settings(){return head('PORTFOLIO DATA','Data & settings','Import fictional sample records or reset this browser demo.')+'<div class="grid"><div class="card"><h2>Import client CSV</h2><p class="muted">Columns: id, name, balance, rate, term, expiry, review, contact. Import replaces current client book.</p><div class="notice warning"><b>Do not upload real customer data.</b> This browser demo has no secure backend, authentication, consent management or production privacy controls.</div><input id="file" type="file" accept=".csv,text/csv" class="control"><div class="actions" style="margin-top:16px">'+btn('Import fictional CSV →','importCSV()')+btn('Download template','sampleCSV()','alt')+'</div></div><div class="card"><h2>Demo controls</h2><p class="muted">Records are stored locally in your browser on this device.</p><div class="actions">'+btn('Reset all demo data','reset()','light')+btn('Export activity','exportEvents()','alt')+'</div><div class="notice">Production requires a secure multi-tenant backend, authorised CRM integrations, messaging provider, role-based access, consent controls and audit evidence.</div></div></div>'}
function sampleCSV(){download('retainiq-broker-template.csv','id,name,balance,rate,term,expiry,review,contact\nB301,Sample Borrower,500000,6.1,Variable,0,30,true\n')}
function parseCSV(t){let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\r'||c==='\n')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importCSV(){let f=$('file').files?.[0];if(!f){toast('Choose a CSV file');return}if(f.size>300000){toast('Maximum file size is 300 KB');return}let r=new FileReader();r.onload=()=>{try{let rows=parseCSV(r.result),keys=rows.shift().map(x=>x.trim().toLowerCase()),req=['id','name','balance','rate','term','expiry','review','contact'];if(req.some(x=>!keys.includes(x)))throw Error('Missing required columns');let clients=rows.map(row=>{let o=Object.fromEntries(keys.map((k,i)=>[k,(row[i]||'').trim()]));let c={id:o.id,name:o.name,balance:+o.balance,rate:+o.rate,term:o.term,expiry:+o.expiry,review:+o.review,contact:o.contact.toLowerCase()==='true',trail:.0015,months:30,stage:'Settled'};if(!c.id||!c.name||!['Fixed','Variable'].includes(c.term)||!Number.isFinite(c.balance)||!Number.isFinite(c.rate)||!Number.isFinite(c.expiry)||!Number.isFinite(c.review)||c.balance<=0||c.rate<=0||c.rate>30||c.expiry<0||c.review<0)throw Error('Invalid client row');return c});if(!clients.length||clients.length>500||new Set(clients.map(x=>x.id)).size!==clients.length)throw Error('Invalid row count or duplicate IDs');if(!confirm('Replace '+state.clients.length+' fictional records with '+clients.length+' imported records?'))return;state.clients=clients;log('CSV import',clients.length+' fictional clients');render();toast('Client records imported')}catch(e){alert('Import failed: '+e.message)}};r.readAsText(f)}
function reset(){if(!confirm('Reset all local demo records and actions?'))return;localStorage.removeItem('retainIQ-broker-v1');location.reload()}render();
</script></body></html>
