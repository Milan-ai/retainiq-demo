<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetainIQ Property</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8f7;color:#20352f;font:14px Inter,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}aside{width:225px;background:#fff;border-right:1px solid #e5ede9;padding:27px 15px;flex-shrink:0}.brand{font-size:27px;font-weight:850;letter-spacing:-1.5px;padding:0 10px}.brand span{color:#258568}.strap{font-size:10px;letter-spacing:1.2px;color:#9baaa5;margin:6px 10px 30px;font-weight:750}nav button{display:block;width:100%;text-align:left;padding:13px 12px;background:none;border:0;border-radius:10px;color:#71867d;font-size:12px;font-weight:700;margin:3px 0}nav button.active,nav button:hover{background:#e6f5ee;color:#157257}main{width:100%;max-width:1400px;margin:auto;padding:36px 40px 80px;min-width:0}.eyebrow{color:#9aaba3;font-size:10px;font-weight:800;letter-spacing:1.4px}.hero{margin:38px 0 25px}.hero h1{font-size:clamp(32px,4vw,48px);letter-spacing:-1.9px;margin:8px 0}.hero p,.muted{color:#83968c;line-height:1.7;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.metric,.card{background:#fff;border:1px solid #e4ece7;border-radius:18px;padding:22px}.metric b{display:block;font-size:29px;margin:12px 0 5px;letter-spacing:-1px}.metric small{font-size:11px;color:#8b9e94}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section{font-size:20px;letter-spacing:-.6px;margin:30px 0 14px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #edf2ef}.line:last-child{border:0}.line b{font-size:12px}.line p{font-size:11px;color:#87998f;line-height:1.6;margin:5px 0}.btn{background:#218367;color:#fff;border:0;border-radius:22px;padding:10px 14px;font-size:11px;font-weight:750;white-space:nowrap}.btn.alt{background:#e6f4ed;color:#23795f}.btn.light{background:#edf1ef;color:#65786e}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.pill{font-size:10px;font-weight:750;background:#e8f5ed;color:#287b58;border-radius:30px;padding:5px 9px}.pill.warn{background:#fff3e0;color:#986c29}.control{width:100%;border:1px solid #dce7e0;border-radius:10px;padding:11px 12px;background:#fff;color:#2d4439}.field{display:block;font-size:11px;color:#788f81;font-weight:800;margin:15px 0 6px}textarea.control{min-height:130px;resize:vertical;line-height:1.6}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:13px 9px;text-align:left;border-bottom:1px solid #edf2ee;font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#a0afa5}td small{display:block;color:#9eaca4;margin-top:4px}.notice{background:#fff8e9;color:#866c3e;border:1px solid #f0e3c8;border-radius:12px;padding:14px;font-size:12px;line-height:1.7;margin:18px 0}.empty{padding:25px;text-align:center;color:#9aa9a0}.mobile{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#234537;color:white;border-radius:12px;padding:14px 18px;font-size:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:900px){aside{width:180px}main{padding:25px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{display:none}.mobile{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;position:sticky;top:0;z-index:2}.mobile button{border:0;border-radius:20px;background:#e8f4ec;padding:10px;white-space:nowrap;font-size:11px}.mobile button.active{background:#218367;color:white}.grid,.cols{grid-template-columns:1fr}main{padding:20px 14px 60px}.metric,.card{padding:16px}.metric b{font-size:24px}}
</style></head><body><div id="mobile" class="mobile"></div><div class="shell"><aside><div class="brand">retain<span>IQ</span></div><div class="strap">PROPERTY INTELLIGENCE</div><nav id="nav"></nav><p class="muted" style="margin:35px 12px">Fictional agency demo<br>Local browser storage<br>No real messaging</p></aside><main><div class="eyebrow">RETAINIQ / PROPERTY WORKSPACE</div><div id="app"></div></main></div><div id="toast" class="toast" hidden></div><script>
const initial=[
{id:'P101',name:'Olivia Harper',address:'14 Example Street, Paddington',type:'Appraisal',days:92,value:1250000,reason:'Requested spring market update',stage:'Follow-up due',consent:true},
{id:'P102',name:'Noah Williams',address:'8 Sample Avenue, New Farm',type:'Appraisal',days:37,value:1580000,reason:'Requested updated appraisal',stage:'Warm',consent:true},
{id:'P103',name:'Ava Singh',address:'22 Demo Road, West End',type:'Vendor',days:9,value:980000,reason:'Vendor report due',stage:'Campaign live',consent:true},
{id:'P104',name:'Liam Chen',address:'6 Fiction Lane, Camp Hill',type:'Appraisal',days:210,value:1130000,reason:'Appraisal follow-up overdue',stage:'Dormant',consent:false},
{id:'P105',name:'Mia Thompson',address:'3 Sample Court, Bulimba',type:'Buyer',days:15,value:1420000,reason:'Requested property update',stage:'Active buyer',consent:true},
{id:'P106',name:'Ethan Patel',address:'19 Example Terrace, Highgate Hill',type:'Appraisal',days:65,value:1070000,reason:'Asked about market movement',stage:'Warm',consent:true},
{id:'P107',name:'Grace Martin',address:'40 Test Street, Teneriffe',type:'Vendor',days:17,value:1740000,reason:'Buyer feedback outstanding',stage:'Campaign live',consent:true},
{id:'P108',name:'Leo Brown',address:'11 Illustration Place, Coorparoo',type:'Past seller',days:360,value:890000,reason:'Settlement anniversary',stage:'Relationship',consent:true}
];
const campaigns0=[
{id:'C1',property:'22 Demo Road, West End',vendor:'Ava Singh',views:1280,enquiries:19,inspections:11,offers:1,feedback:'Great outdoor area; kitchen dated',next:'Vendor report due'},
{id:'C2',property:'40 Test Street, Teneriffe',vendor:'Grace Martin',views:2410,enquiries:26,inspections:17,offers:2,feedback:'Excellent position; mixed price feedback',next:'Discuss buyer feedback'}
];
let state;try{state=JSON.parse(localStorage.getItem('retainIQ-property-v1'))}catch(e){}
if(!state||!Array.isArray(state.people))state={people:structuredClone(initial),campaigns:structuredClone(campaigns0),tasks:[],drafts:[],events:[],next:1};
let page='overview',focus=null,selected=[],message='',channel='Email';
const menu=[['overview','Overview'],['contacts','Contacts & appraisals'],['opportunities','Listing intelligence'],['campaigns','Vendor campaigns'],['reports','Vendor reports'],['outreach','Client outreach'],['tasks','Action centre'],['performance','Performance'],['settings','Settings']];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(v);
function save(){localStorage.setItem('retainIQ-property-v1',JSON.stringify(state))}
function log(type,detail){state.events.unshift({type,detail,at:new Date().toLocaleString('en-AU')});save()}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3000)}
function btn(t,fn,style=''){return '<button class="btn '+style+'" onclick="'+fn+'">'+t+'</button>'}
function head(k,t,s){return '<div class="hero"><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+s+'</p></div>'}
function metric(k,v,n=''){return '<div class="metric"><small>'+k+'</small><b>'+v+'</b><small>'+n+'</small></div>'}
function pill(t){return '<span class="pill '+(/due|overdue|Dormant/.test(t)?'warn':'')+'">'+esc(t)+'</span>'}
function notice(){return '<div class="notice">Fictional demo: people, addresses, values and campaign statistics are invented. No real CRM, listing portal, email or SMS services are connected. Do not enter real client personal data.</div>'}
function nav(p){page=p;focus=null;selected=[];render();window.scrollTo(0,0)}
function render(){let n=menu.map(([id,t])=>'<button class="'+(page===id?'active':'')+'" onclick="nav(\''+id+'\')">'+t+'</button>').join('');$('nav').innerHTML=n;$('mobile').innerHTML=n;$('app').innerHTML=({overview,contacts,opportunities,campaigns,reports,outreach,tasks,performance,settings})[page]()}
function sorted(){return [...state.people].sort((a,b)=>(a.type==='Appraisal'?0:1)-(b.type==='Appraisal'?0:1)||b.days-a.days)}
function overview(){let due=state.people.filter(c=>c.type==='Appraisal'&&c.days>=60);return head('YOUR NEXT LISTING STARTS HERE','Good morning, Sarah.','Find the right client conversations, stay ahead of campaign work and record the outcomes.')+'<div class="metrics">'+metric('Appraisal follow-ups',due.length,'60+ days since appraisal')+metric('Vendor campaigns',state.campaigns.length)+metric('Buyer relationships',state.people.filter(c=>c.type==='Buyer').length)+metric('Open tasks',state.tasks.filter(t=>!t.done).length)+'</div><h2 class="section">Today’s opportunities</h2><div class="grid"><div class="card">'+sorted().slice(0,5).map(c=>'<div class="line"><div><b>'+esc(c.address)+'</b> '+pill(c.stage)+'<p>'+esc(c.name)+' · '+esc(c.reason)+'</p></div>'+btn('Review →','openContact(\''+c.id+'\')')+'</div>').join('')+'</div><div class="card"><h2>Vendor experience</h2><p class="muted">Prepare client-ready campaign reports using recorded activity.</p>'+state.campaigns.map(c=>'<div class="line"><div><b>'+esc(c.property)+'</b><p>'+c.inspections+' inspections · '+c.offers+' offers · '+esc(c.next)+'</p></div>'+btn('Report →','openReport(\''+c.id+'\')','alt')+'</div>').join('')+btn('View campaigns →','nav(\'campaigns\')','alt')+'</div></div>'+notice()}
function openContact(id){page='contacts';focus=id;render();window.scrollTo(0,0)}
function contactRows(list){return '<div class="scroll"><table><thead><tr><th>Contact</th><th>Property</th><th>Relationship</th><th>Days</th><th>Follow-up reason</th><th>Action</th></tr></thead><tbody>'+list.map(c=>'<tr><td><b>'+esc(c.name)+'</b><small>'+c.id+'</small></td><td>'+esc(c.address)+'</td><td>'+pill(c.type)+'</td><td>'+c.days+'</td><td>'+esc(c.reason)+'</td><td>'+btn('Open →','openContact(\''+c.id+'\')','alt')+'</td></tr>').join('')+'</tbody></table></div>'}
function contacts(){if(focus)return contactDetail();return head('RELATIONSHIP INTELLIGENCE','Contacts & appraisals','A connected picture of your agency’s clients, appraisals and next conversations.')+'<div class="card">'+contactRows(state.people)+'</div><h2 class="section">Add fictional contact</h2><div class="card"><div class="cols"><div><label class="field">Name</label><input id="name" class="control" placeholder="Sample client"><label class="field">Property address</label><input id="address" class="control" placeholder="12 Sample Street, Brisbane"><label class="field">Relationship</label><select id="type" class="control"><option>Appraisal</option><option>Vendor</option><option>Buyer</option><option>Past seller</option></select></div><div><label class="field">Indicative property value</label><input id="value" type="number" class="control" value="900000"><label class="field">Days since last event</label><input id="days" type="number" class="control" value="90"><label class="field">Documented follow-up reason</label><input id="reason" class="control" placeholder="Requested market update"></div></div><div class="actions">'+btn('Add sample contact','addContact()')+'</div></div>'}
function addContact(){let name=$('name').value.trim(),address=$('address').value.trim(),reason=$('reason').value.trim(),value=+$('value').value,days=+$('days').value;if(!name||!address||!reason||value<=0||days<0||!Number.isFinite(days)){toast('Complete all valid fields');return}let id='P'+(200+state.next++);state.people.push({id,name,address,reason,value,days,type:$('type').value,stage:'New',consent:false});log('Contact created',id+' · '+name);render();toast('Contact added')}
function contactDetail(){let c=state.people.find(x=>x.id===focus);if(!c)return contacts();return btn('← Back','focus=null;render()','light')+head('CLIENT / '+c.id,esc(c.name),esc(c.address))+'<div class="metrics">'+metric('Relationship',esc(c.type))+metric('Indicative value',money(c.value))+metric('Days since event',c.days)+metric('Consent',c.consent?'Demo yes':'Unverified')+'</div><div class="grid"><div class="card"><h2>Recommended conversation</h2><p class="muted">'+esc(c.reason)+'</p><div class="notice">Signals come from recorded events and requests, not a prediction that the owner intends to sell.</div>'+btn('Create follow-up task','addTask(\''+c.id+'\')')+'</div><div class="card"><h2>Relationship stage</h2><label class="field">Stage</label><select id="stage" class="control">'+['New','Warm','Follow-up due','Appraisal booked','Listing won','Listing lost','Campaign live','Relationship','Dormant'].map(s=>'<option '+(s===c.stage?'selected':'')+'>'+s+'</option>').join('')+'</select><div class="actions">'+btn('Save stage','saveStage(\''+c.id+'\')')+btn('Prepare outreach','prepare(\''+c.id+'\')','alt')+'</div></div></div>'}
function saveStage(id){let c=state.people.find(x=>x.id===id);c.stage=$('stage').value;log('Stage updated',id+' · '+c.stage);render();toast('Stage saved')}
function opportunities(){let list=sorted().filter(c=>c.type==='Appraisal'||c.type==='Past seller');return head('CONVERT RELATIONSHIPS INTO LISTINGS','Listing intelligence','Prioritise documented appraisal follow-ups and track conversations through to listings.')+'<div class="metrics">'+metric('Appraisals',state.people.filter(c=>c.type==='Appraisal').length)+metric('Follow-ups due',state.people.filter(c=>c.type==='Appraisal'&&c.days>=60).length)+metric('Appraisals booked',state.people.filter(c=>c.stage==='Appraisal booked').length)+metric('Listings won',state.people.filter(c=>c.stage==='Listing won').length)+'</div><div class="card">'+list.map(c=>'<div class="line"><div><b>'+esc(c.address)+'</b> '+pill(c.stage)+'<p>'+esc(c.name)+' · '+c.days+' days · '+esc(c.reason)+'</p></div>'+btn('Review →','openContact(\''+c.id+'\')')+'</div>').join('')+'</div>'+notice()}
function openCampaign(id){page='campaigns';focus=id;render();window.scrollTo(0,0)}
function campaigns(){if(focus)return campaignDetail();return head('CAMPAIGN MANAGEMENT','Vendor campaigns','Track enquiries, inspections, offers, feedback and the next action.')+'<div class="metrics">'+metric('Campaigns',state.campaigns.length)+metric('Enquiries',state.campaigns.reduce((s,c)=>s+c.enquiries,0))+metric('Inspections',state.campaigns.reduce((s,c)=>s+c.inspections,0))+metric('Offers',state.campaigns.reduce((s,c)=>s+c.offers,0))+'</div><div class="card">'+state.campaigns.map(c=>'<div class="line"><div><b>'+esc(c.property)+'</b><p>'+esc(c.vendor)+' · '+c.enquiries+' enquiries · '+c.inspections+' inspections · '+esc(c.next)+'</p></div>'+btn('Manage →','openCampaign(\''+c.id+'\')')+'</div>').join('')+'</div>'}
function campaignDetail(){let c=state.campaigns.find(x=>x.id===focus);if(!c)return campaigns();return btn('← Campaigns','focus=null;render()','light')+head('CAMPAIGN / '+c.id,esc(c.property),'Vendor: '+esc(c.vendor))+'<div class="card"><div class="cols"><div>'+['views','enquiries','inspections'].map(k=>'<label class="field">'+k+'</label><input type="number" class="control" id="'+k+'" value="'+c[k]+'">').join('')+'</div><div><label class="field">Offers</label><input type="number" class="control" id="offers" value="'+c.offers+'"><label class="field">Next action</label><input id="next" class="control" value="'+esc(c.next)+'"><label class="field">Buyer feedback</label><textarea id="feedback" class="control">'+esc(c.feedback)+'</textarea></div></div><div class="actions">'+btn('Save campaign','saveCampaign(\''+c.id+'\')')+btn('Build vendor report','openReport(\''+c.id+'\')','alt')+'</div></div>'}
function saveCampaign(id){let c=state.campaigns.find(x=>x.id===id);for(let k of ['views','enquiries','inspections','offers']){let n=+$(k).value;if(!Number.isInteger(n)||n<0){toast('Enter non-negative whole numbers');return}c[k]=n}c.next=$('next').value.trim();c.feedback=$('feedback').value.trim();log('Campaign updated',id);render();toast('Campaign saved')}
function openReport(id){page='reports';focus=id;render();window.scrollTo(0,0)}
function reportText(c){return 'PROPERTY CAMPAIGN REPORT\n'+c.property+'\nVendor: '+c.vendor+'\nViews: '+c.views+'\nEnquiries: '+c.enquiries+'\nInspections: '+c.inspections+'\nOffers: '+c.offers+'\nFeedback: '+c.feedback+'\nNext action: '+c.next+'\n\nIllustrative demo figures — verify before sharing.'}
function reports(){let c=state.campaigns.find(x=>x.id===focus)||state.campaigns[0];return head('BETTER VENDOR COMMUNICATION','Vendor reports','Turn campaign activity into a clear report you can review and copy.')+'<div class="card"><label class="field">Campaign</label><select class="control" onchange="focus=this.value;render()">'+state.campaigns.map(x=>'<option value="'+x.id+'" '+(c.id===x.id?'selected':'')+'>'+esc(x.property)+'</option>').join('')+'</select></div><h2 class="section">Report preview</h2><div class="card"><div class="eyebrow">PROPERTY CAMPAIGN REPORT</div><h2>'+esc(c.property)+'</h2><p class="muted">Prepared for '+esc(c.vendor)+'</p><div class="metrics">'+metric('Views',c.views)+metric('Enquiries',c.enquiries)+metric('Inspections',c.inspections)+metric('Offers',c.offers)+'</div><h3>Buyer feedback</h3><p class="muted">'+esc(c.feedback)+'</p><h3>Next action</h3><p class="muted">'+esc(c.next)+'</p>'+notice()+'<div class="actions">'+btn('Copy report','copyReport(\''+c.id+'\')')+btn('Create vendor task','addTask(\''+c.id+'\')','alt')+'</div></div>'}
function copyReport(id){let c=state.campaigns.find(x=>x.id===id),t=reportText(c);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('Report copied')).catch(()=>toast('Clipboard unavailable'));else{let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Report copied')}}
function addTask(id){let c=state.people.find(x=>x.id===id)||state.campaigns.find(x=>x.id===id),task={id:'T'+(state.next++),subject:id,detail:c.reason||c.next,status:'Open',outcome:'',done:false};state.tasks.unshift(task);log('Task created',task.id+' · '+id);page='tasks';focus=null;render();toast('Task created')}
function tasks(){return head('ACTION CENTRE','Nothing gets missed.','Keep a clear record of follow-ups, ownership and outcomes.')+'<div class="metrics">'+metric('Open',state.tasks.filter(t=>!t.done).length)+metric('Completed',state.tasks.filter(t=>t.done).length)+metric('Recorded events',state.events.length)+metric('Outreach drafts',state.drafts.length)+'</div><div class="card">'+(state.tasks.length?state.tasks.map(t=>'<div class="line"><div><b>'+esc(t.subject)+'</b> '+pill(t.status)+'<p>'+esc(t.detail)+(t.outcome?' · '+esc(t.outcome):'')+'</p></div>'+(t.done?'':btn('Record outcome →','finish(\''+t.id+'\')','alt'))+'</div>').join(''):'<div class="empty">No tasks yet. Create one from a contact or campaign report.</div>')+'</div><h2 class="section">Activity log</h2><div class="card">'+state.events.slice(0,25).map(e=>'<div class="line"><div><b>'+esc(e.type)+'</b><p>'+esc(e.detail)+'</p></div><small class="muted">'+esc(e.at)+'</small></div>').join('')+'</div>'}
function finish(id){let t=state.tasks.find(x=>x.id===id),outcome=prompt('Record what happened:');if(!outcome?.trim())return;t.done=true;t.status='Completed';t.outcome=outcome.trim();log('Task completed',id+' · '+t.outcome);render()}
function prepare(id){page='outreach';selected=[id];render();window.scrollTo(0,0)}
function selectContact(id,on){selected=on?[...new Set([...selected,id])]:selected.filter(x=>x!==id)}
function selectAll(on){selected=on?state.people.map(x=>x.id):[];render()}
function outreach(){return head('PERSONALISED, REVIEWABLE COMMUNICATION','Client outreach','Prepare an outreach draft. No actual emails or SMS are sent.')+'<div class="card"><div class="actions">'+btn('Select all','selectAll(true)','alt')+btn('Clear','selectAll(false)','light')+'</div><div class="scroll"><table><thead><tr><th>Select</th><th>Contact</th><th>Reason</th><th>Permission</th></tr></thead><tbody>'+state.people.map(c=>'<tr><td><input type="checkbox" '+(selected.includes(c.id)?'checked':'')+' onchange="selectContact(\''+c.id+'\',this.checked)"></td><td>'+esc(c.name)+'</td><td>'+esc(c.reason)+'</td><td>'+pill(c.consent?'Demo yes':'Not verified')+'</td></tr>').join('')+'</tbody></table></div><label class="field">Channel</label><select id="channel" class="control"><option>Email</option><option>SMS</option><option>Call</option></select><label class="field">Editable message ({{first_name}} placeholder)</label><textarea id="message" class="control">Hi {{first_name}}, following our previous property conversation, would you like a market update? Please contact our office if helpful.</textarea>'+notice()+'<div class="actions">'+btn('Review recipients and prepare draft →','prepareDraft()')+'</div></div><h2 class="section">Prepared drafts</h2><div class="card">'+(state.drafts.length?state.drafts.map(d=>'<div class="line"><div><b>'+esc(d.channel)+' · '+d.id+'</b><p>'+d.eligible+' eligible · '+d.excluded+' excluded · Not sent</p></div></div>').join(''):'<div class="empty">No drafts yet.</div>')+'</div>'}
function prepareDraft(){let people=state.people.filter(c=>selected.includes(c.id));if(!people.length){toast('Select contacts first');return}let text=$('message').value.trim();if(!text){toast('Enter a message');return}let eligible=people.filter(c=>c.consent),excluded=people.length-eligible.length;if(!confirm('Prepare local draft for '+eligible.length+' eligible fictional contacts? '+excluded+' excluded. No messages will be sent.'))return;let id='M'+state.next++;state.drafts.unshift({id,channel:$('channel').value,message:text,eligible:eligible.length,excluded});log('Draft prepared',id+' · '+eligible.length+' eligible, '+excluded+' excluded');selected=[];render();toast('Draft recorded — nothing sent')}
function performance(){return head('MEASURE REAL ACTIONS','Performance','See the workflow outcomes actually recorded in this demo, not invented revenue.')+'<div class="metrics">'+metric('Appraisals',state.people.filter(c=>c.type==='Appraisal').length)+metric('Listings marked won',state.people.filter(c=>c.stage==='Listing won').length)+metric('Completed tasks',state.tasks.filter(t=>t.done).length)+metric('Drafts prepared',state.drafts.length)+'</div><div class="grid"><div class="card"><h2>Operational outcomes</h2>'+[['Follow-up tasks created',state.tasks.length],['Tasks completed',state.tasks.filter(t=>t.done).length],['Listings won (manual stage)',state.people.filter(c=>c.stage==='Listing won').length],['Vendor campaigns',state.campaigns.length]].map(x=>'<div class="line"><b>'+x[0]+'</b><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><h2>Revenue measurement</h2><p class="muted">Actual gross commission income, verified listings, attribution and hours saved are not measured in this prototype. Production would require CRM and transaction integrations.</p>'+notice()+'</div></div><div class="actions">'+btn('Export tasks CSV','exportTasks()')+btn('Export audit CSV','exportEvents()','alt')+'</div>'}
function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function download(name,rows){let blob=new Blob([rows.map(r=>r.map(csv).join(',')).join('\n')],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportTasks(){download('property-tasks.csv',[['ID','Subject','Detail','Status','Outcome'],...state.tasks.map(t=>[t.id,t.subject,t.detail,t.status,t.outcome])])}
function exportEvents(){download('property-audit.csv',[['Date','Type','Detail'],...state.events.map(e=>[e.at,e.type,e.detail])])}
function settings(){return head('DEMO CONTROLS','Settings','Keep this prototype separate from real client data.')+'<div class="grid"><div class="card"><h2>Reset demo</h2><p class="muted">All records are stored in your browser only. Reset restores fictional data.</p>'+btn('Reset local data','reset()','light')+'</div><div class="card"><h2>Export activity</h2><p class="muted">Download your locally recorded tasks and audit events.</p><div class="actions">'+btn('Task CSV','exportTasks()')+btn('Audit CSV','exportEvents()','alt')+'</div></div></div>'+notice()}
function reset(){if(!confirm('Reset all fictional RetainIQ Property data?'))return;localStorage.removeItem('retainIQ-property-v1');location.reload()}render();
</script></body></html>
