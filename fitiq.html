<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitIQ — Project & Profit Intelligence</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f7;color:#1b3033;font:14px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}aside{width:235px;flex:none;background:#101f26;color:#e7f2f1;padding:27px 16px}.logo{font-size:30px;font-weight:850;letter-spacing:-1.5px;padding:0 10px}.logo span{color:#5ed1aa}.tag{font-size:10px;letter-spacing:1.3px;color:#91a6a8;margin:4px 10px 33px}nav button{display:block;border:0;border-radius:10px;background:transparent;color:#a5b9bb;text-align:left;width:100%;padding:13px 12px;font-size:12px;font-weight:700;margin:3px 0}nav button.active,nav button:hover{background:#21443f;color:#b4f0d8}main{min-width:0;width:100%;max-width:1500px;margin:auto;padding:38px 42px 80px}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;color:#879ca1}.hero{margin:37px 0 25px}.hero h1{font-size:clamp(31px,4vw,49px);letter-spacing:-2px;margin:8px 0}.muted,.hero p{color:#7f9498;font-size:12px;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.metric,.card{background:#fff;border:1px solid #e2e9e8;border-radius:17px;padding:22px}.metric b{display:block;font-size:28px;letter-spacing:-1px;margin:12px 0 4px}.metric small{font-size:11px;color:#87999c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.section{font-size:20px;letter-spacing:-.6px;margin:30px 0 14px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #eef2f1}.line:last-child{border:0}.line b{font-size:12px}.line p{font-size:11px;color:#85969a;margin:5px 0;line-height:1.6}.btn{border:0;background:#176d5a;color:#fff;padding:10px 14px;border-radius:20px;font-size:11px;font-weight:750;white-space:nowrap}.btn.alt{background:#e2f3ec;color:#166e57}.btn.light{background:#eef1f2;color:#61777b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.pill{display:inline-block;font-size:10px;border-radius:20px;padding:5px 9px;background:#e2f3ec;color:#166d55;font-weight:750}.pill.warn{background:#fff0dd;color:#966629}.pill.danger{background:#ffe9e5;color:#b35743}.field{display:block;font-size:11px;font-weight:750;color:#698085;margin:14px 0 6px}.control{width:100%;border:1px solid #dce5e4;border-radius:9px;padding:11px;background:#fff;color:#243c3f}textarea.control{min-height:100px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{border-bottom:1px solid #edf1f0;text-align:left;padding:13px 9px;font-size:12px}th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#9aabae}.notice{border-radius:11px;padding:14px;background:#fff8e8;border:1px solid #f1e5ca;color:#8a7043;font-size:12px;line-height:1.7;margin:18px 0}.bar{height:8px;border-radius:8px;background:#e9eeee;overflow:hidden;margin-top:10px}.bar>div{height:100%;background:#258b70;border-radius:8px}.empty{text-align:center;color:#8b9da0;padding:30px}.mobile{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#183d34;color:white;border-radius:10px;padding:13px 17px;font-size:12px}.small{font-size:11px;color:#82979b}@media(max-width:950px){aside{width:185px}main{padding:25px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{display:none}.mobile{display:flex;gap:7px;overflow:auto;padding:10px;background:#11242a;position:sticky;top:0;z-index:3}.mobile button{border:0;background:#234c45;color:#e4f2ed;border-radius:20px;padding:10px 12px;white-space:nowrap;font-size:11px}.mobile button.active{background:#5ed1aa;color:#0f3027}main{padding:20px 14px 65px}.grid,.cols{grid-template-columns:1fr}.card,.metric{padding:16px}.metric b{font-size:24px}}
</style></head><body><div id="mobile" class="mobile"></div><div class="layout"><aside><div class="logo">fit<span>IQ</span></div><div class="tag">PROJECT & PROFIT INTELLIGENCE</div><nav id="nav"></nav><p class="muted" style="margin:35px 12px;color:#799597">Australian shopfitting demo<br>Fictional project data<br>Browser-local storage</p></aside><main><div class="eyebrow">FITIQ / OPERATIONS WORKSPACE</div><div id="app"></div></main></div><div id="toast" class="toast" hidden></div><script>
const projects0=[
{id:'J101',name:'Brisbane CBD Retail Store',client:'Retail Collective',value:180000,budget:135000,spent:92000,committed:26000,remaining:26000,progress:72,status:'At risk',deadline:'2026-11-20'},
{id:'J102',name:'Fortitude Valley Hospitality Fitout',client:'Example Hospitality',value:345000,budget:266000,spent:143000,committed:68000,remaining:53000,progress:55,status:'On track',deadline:'2026-12-18'},
{id:'J103',name:'South Brisbane Medical Suite',client:'Sample Health Group',value:420000,budget:315000,spent:226000,committed:52000,remaining:61000,progress:81,status:'At risk',deadline:'2026-11-28'},
{id:'J104',name:'Newstead Boutique Showroom',client:'Studio Sample',value:235000,budget:173000,spent:56000,committed:68000,remaining:46000,progress:39,status:'On track',deadline:'2027-01-16'}];
const variations0=[
{id:'V101',job:'J101',title:'Additional display joinery',amount:14500,cost:8700,status:'Pending approval'},
{id:'V102',job:'J102',title:'Revised bar layout',amount:19500,cost:11800,status:'Pending approval'},
{id:'V103',job:'J103',title:'Extra power and data points',amount:8500,cost:4800,status:'Pending approval'},
{id:'V104',job:'J101',title:'Premium laminate substitution',amount:6200,cost:3900,status:'Approved'}];
const trades0=[
{id:'S1',job:'J101',trade:'Joinery installation',contractor:'Sample Joinery Co',date:'2026-11-06',status:'Scheduled'},
{id:'S2',job:'J102',trade:'Electrical rough-in',contractor:'Example Electrical',date:'2026-11-09',status:'Scheduled'},
{id:'S3',job:'J103',trade:'Flooring delivery',contractor:'Demo Flooring',date:'2026-11-04',status:'Delayed'}];
const claims0=[
{id:'I1',job:'J101',title:'Progress claim 2',amount:54000,status:'Awaiting payment'},
{id:'I2',job:'J102',title:'Deposit',amount:69000,status:'Paid'},
{id:'I3',job:'J103',title:'Progress claim 3',amount:84000,status:'Awaiting payment'}];
const defects0=[
{id:'D1',job:'J101',title:'Adjust display door alignment',owner:'Joinery crew',status:'Open'},
{id:'D2',job:'J103',title:'Replace damaged ceiling tile',owner:'Ceiling contractor',status:'Open'}];
let state;try{state=JSON.parse(localStorage.getItem('fitiq-v1'))}catch(e){}
if(!state||!Array.isArray(state.projects))state={projects:structuredClone(projects0),variations:structuredClone(variations0),trades:structuredClone(trades0),claims:structuredClone(claims0),defects:structuredClone(defects0),tasks:[],events:[],next:1};
let page='overview',focus=null;const menu=[['overview','Overview'],['projects','Projects & margins'],['quotes','Quote intelligence'],['variations','Variations'],['schedule','Trade scheduling'],['payments','Payments & cash flow'],['handover','Defects & handover'],['actions','Action centre'],['settings','Data & settings']];
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),aud=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n);
const margin=p=>p.value?(p.value-p.spent-p.committed-p.remaining)/p.value*100:0,profit=p=>p.value-p.spent-p.committed-p.remaining;
function save(){localStorage.setItem('fitiq-v1',JSON.stringify(state))}
function log(type,detail){state.events.unshift({type,detail,at:new Date().toLocaleString('en-AU')});save()}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3000)}
function btn(t,fn,style=''){return '<button class="btn '+style+'" onclick="'+fn+'">'+t+'</button>'}
function head(k,t,s){return '<div class="hero"><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+s+'</p></div>'}
function metric(k,v,n=''){return '<div class="metric"><small>'+k+'</small><b>'+v+'</b><small>'+n+'</small></div>'}
function pill(t){return '<span class="pill '+(/risk|Delayed|Overdue|Rejected/.test(t)?'danger':/Pending|Awaiting|Open/.test(t)?'warn':'')+'">'+esc(t)+'</span>'}
function notice(){return '<div class="notice"><b>Fictional demonstration.</b> All jobs, clients, amounts and suppliers are invented. Forecasts depend on manual estimates; they are not verified accounting results. No accounting, messaging or document-signing integrations are connected.</div>'}
function job(id){return state.projects.find(x=>x.id===id)}
function jobName(id){return job(id)?.name||id}
function nav(p){page=p;focus=null;render();window.scrollTo(0,0)}
function render(){let n=menu.map(([id,t])=>'<button class="'+(page===id?'active':'')+'" onclick="nav(\''+id+'\')">'+t+'</button>').join('');$('nav').innerHTML=n;$('mobile').innerHTML=n;$('app').innerHTML=({overview,projects,quotes,variations,schedule,payments,handover,actions,settings})[page]()}
function projectLine(p){return '<div class="line"><div><b>'+esc(p.name)+'</b> '+pill(p.status)+'<p>'+esc(p.client)+' · Contract '+aud(p.value)+' · Forecast margin '+margin(p).toFixed(1)+'%</p><div class="bar"><div style="width:'+Math.min(100,p.progress)+'%"></div></div></div>'+btn('Open →','openProject(\''+p.id+'\')','alt')+'</div>'}
function overview(){let revenue=state.projects.reduce((s,p)=>s+p.value,0),gp=state.projects.reduce((s,p)=>s+profit(p),0),pending=state.variations.filter(v=>v.status==='Pending approval');return head('PROJECT CONTROL, WITHOUT THE GUESSWORK','Protect every project’s profit.','See margin exposure, unapproved variations, late trades and unpaid claims before they become bigger problems.')+'<div class="metrics">'+metric('Active contract value',aud(revenue))+metric('Forecast gross margin',(gp/revenue*100).toFixed(1)+'%','Based on cost-to-complete estimates')+metric('Projects at risk',state.projects.filter(p=>p.status==='At risk'||margin(p)<15).length)+metric('Unapproved variations',aud(pending.reduce((s,v)=>s+v.amount,0)))+'</div><div class="grid"><div class="card"><h2>Project profitability</h2>'+state.projects.map(projectLine).join('')+'</div><div class="card"><h2>Needs attention</h2>'+pending.slice(0,3).map(v=>'<div class="line"><div><b>'+esc(v.title)+'</b><p>'+esc(jobName(v.job))+' · '+aud(v.amount)+' awaiting approval</p></div>'+btn('Review →','openVariation(\''+v.id+'\')','alt')+'</div>').join('')+state.trades.filter(t=>t.status==='Delayed').map(t=>'<div class="line"><div><b>'+esc(t.trade)+'</b><p>'+esc(jobName(t.job))+' · Delayed</p></div>'+btn('Schedule →','nav(\'schedule\')','alt')+'</div>').join('')+'</div></div>'+notice()}
function openProject(id){page='projects';focus=id;render();window.scrollTo(0,0)}
function projects(){if(focus)return projectDetail();return head('MARGIN VISIBILITY','Projects & margins','Track actual costs, committed costs and estimated cost to complete for every job.')+'<div class="card">'+state.projects.map(projectLine).join('')+'</div><h2 class="section">Add fictional project</h2><div class="card"><div class="cols"><div><label class="field">Project name</label><input id="name" class="control" placeholder="Example shopfit"><label class="field">Client</label><input id="client" class="control" placeholder="Example client"><label class="field">Contract value (ex GST)</label><input id="value" type="number" class="control" value="180000"></div><div><label class="field">Original estimated cost (ex GST)</label><input id="budget" type="number" class="control" value="135000"><label class="field">Target completion date</label><input id="deadline" type="date" class="control" value="2027-02-28"></div></div><div class="actions">'+btn('Create project','addProject()')+'</div></div>'}
function addProject(){let name=$('name').value.trim(),client=$('client').value.trim(),value=+$('value').value,budget=+$('budget').value;if(!name||!client||value<=0||budget<0){toast('Enter valid project details');return}let id='J'+(200+state.next++);state.projects.push({id,name,client,value,budget,spent:0,committed:0,remaining:budget,progress:0,status:'On track',deadline:$('deadline').value});log('Project created',id+' · '+name);openProject(id)}
function projectDetail(){let p=job(focus);if(!p)return projects();let cost=p.spent+p.committed+p.remaining;return btn('← All projects','focus=null;render()','light')+head('PROJECT / '+p.id,esc(p.name),esc(p.client)+' · Target completion '+esc(p.deadline))+'<div class="metrics">'+metric('Contract value',aud(p.value))+metric('Forecast total cost',aud(cost))+metric('Forecast gross profit',aud(profit(p)))+metric('Forecast gross margin',margin(p).toFixed(1)+'%')+'</div><div class="grid"><div class="card"><h2>Update cost-to-complete forecast</h2><p class="muted">Avoid double-counting: actual costs, committed costs and remaining uncommitted costs must be mutually exclusive.</p><div class="cols"><div><label class="field">Actual costs to date</label><input id="spent" type="number" class="control" value="'+p.spent+'"><label class="field">Committed, not yet incurred</label><input id="committed" type="number" class="control" value="'+p.committed+'"><label class="field">Remaining uncommitted estimate</label><input id="remaining" type="number" class="control" value="'+p.remaining+'"></div><div><label class="field">Completion %</label><input id="progress" type="number" class="control" value="'+p.progress+'"><label class="field">Project status</label><select id="status" class="control">'+['On track','At risk','Completed'].map(s=>'<option '+(s===p.status?'selected':'')+'>'+s+'</option>').join('')+'</select><label class="field">Contract value (approved scope only)</label><input id="value" type="number" class="control" value="'+p.value+'"></div></div><div class="actions">'+btn('Save forecast','saveProject(\''+p.id+'\')')+'</div></div><div class="card"><h2>Profit protection</h2><div class="line"><b>Original estimated cost</b><b>'+aud(p.budget)+'</b></div><div class="line"><b>Forecast cost at completion</b><b>'+aud(cost)+'</b></div><div class="line"><b>Cost variance</b><b>'+aud(cost-p.budget)+'</b></div><div class="line"><b>Forecast gross profit</b><b>'+aud(profit(p))+'</b></div><div class="bar"><div style="width:'+Math.max(0,Math.min(100,margin(p)))+'%"></div></div><p class="muted">Variation revenue is not added to contract value until approved and explicitly applied to the project.</p>'+btn('Review variations →','nav(\'variations\')','alt')+'</div></div>'}
function saveProject(id){let p=job(id),vals={};for(let k of ['spent','committed','remaining','value','progress']){let n=+$(k).value;if(!Number.isFinite(n)||n<0||(k==='progress'&&n>100)){toast('Enter valid non-negative figures');return}vals[k]=n}if(!vals.value){toast('Contract value must be positive');return}Object.assign(p,vals,{status:$('status').value});log('Forecast updated',id+' · '+aud(profit(p))+' forecast gross profit');render();toast('Forecast saved')}
function quotes(){return head('QUOTE WITH CONFIDENCE','Quote intelligence','Model a target margin and see the selling price needed to protect it.')+'<div class="grid"><div class="card"><h2>Quote calculator</h2><label class="field">Materials</label><input id="materials" class="control" type="number" value="48000" oninput="calcQuote()"><label class="field">Labour</label><input id="labour" class="control" type="number" value="39000" oninput="calcQuote()"><label class="field">Subcontractors</label><input id="subs" class="control" type="number" value="31000" oninput="calcQuote()"><label class="field">Other direct costs</label><input id="other" class="control" type="number" value="17000" oninput="calcQuote()"><label class="field">Target gross margin %</label><input id="target" class="control" type="number" value="25" oninput="calcQuote()"><div class="actions">'+btn('Save quote scenario as project','quoteToProject()')+'</div></div><div class="card"><h2>Suggested quote</h2><div id="quoteResult"></div><div class="notice">Gross margin is profit divided by revenue, not a markup on cost. Excludes GST, overhead allocation, financing and tax. Use verified supplier and labour rates before quoting.</div></div></div><script-placeholder></script-placeholder>'}
function quoteValues(){let a=['materials','labour','subs','other'].map(k=>+$(k).value),t=+$('target').value;if(a.some(n=>!Number.isFinite(n)||n<0)||!Number.isFinite(t)||t<0||t>=100)return null;let cost=a.reduce((s,n)=>s+n,0);return {cost,t,price:cost/(1-t/100)}}
function calcQuote(){let q=quoteValues();$('quoteResult').innerHTML=q?'<div class="metrics" style="grid-template-columns:1fr 1fr">'+metric('Direct cost',aud(q.cost))+metric('Target margin',q.t+'%')+metric('Suggested price',aud(q.price))+metric('Gross profit',aud(q.price-q.cost))+'</div>':'<div class="notice">Enter non-negative costs and a margin below 100%.</div>'}
function quoteToProject(){let q=quoteValues();if(!q){toast('Check quote values');return}let name=prompt('Project name for this fictional quote:');if(!name?.trim())return;let id='J'+(200+state.next++);state.projects.push({id,name:name.trim(),client:'Prospective client',value:Math.round(q.price),budget:q.cost,spent:0,committed:0,remaining:q.cost,progress:0,status:'On track',deadline:''});log('Quote converted to project',id+' · '+name);openProject(id)}
function openVariation(id){page='variations';focus=id;render();window.scrollTo(0,0)}
function variations(){if(focus)return variationDetail();return head('STOP GIVING WORK AWAY','Variation control','Track extra scope, approval status and the commercial effect of each change.')+'<div class="metrics">'+metric('Pending approval',state.variations.filter(v=>v.status==='Pending approval').length)+metric('Pending revenue',aud(state.variations.filter(v=>v.status==='Pending approval').reduce((s,v)=>s+v.amount,0)))+metric('Approved variations',state.variations.filter(v=>v.status==='Approved').length)+metric('Rejected variations',state.variations.filter(v=>v.status==='Rejected').length)+'</div><div class="card">'+state.variations.map(v=>'<div class="line"><div><b>'+esc(v.title)+'</b> '+pill(v.status)+'<p>'+esc(jobName(v.job))+' · Price '+aud(v.amount)+' · Est. cost '+aud(v.cost)+'</p></div>'+btn('Review →','openVariation(\''+v.id+'\')','alt')+'</div>').join('')+'</div><h2 class="section">Register new variation</h2><div class="card"><div class="cols"><div><label class="field">Project</label><select id="job" class="control">'+state.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><label class="field">Scope change</label><input id="title" class="control" placeholder="Additional joinery"></div><div><label class="field">Quoted variation revenue</label><input id="amount" type="number" class="control" value="5000"><label class="field">Estimated direct cost</label><input id="cost" type="number" class="control" value="3000"></div></div><div class="actions">'+btn('Create pending variation','addVariation()')+'</div></div>'}
function addVariation(){let title=$('title').value.trim(),amount=+$('amount').value,cost=+$('cost').value;if(!title||amount<=0||cost<0){toast('Enter valid variation details');return}let id='V'+(200+state.next++);state.variations.unshift({id,job:$('job').value,title,amount,cost,status:'Pending approval'});log('Variation registered',id+' · '+title);openVariation(id)}
function variationDetail(){let v=state.variations.find(x=>x.id===focus);if(!v)return variations();return btn('← All variations','focus=null;render()','light')+head('VARIATION / '+v.id,esc(v.title),esc(jobName(v.job)))+'<div class="metrics">'+metric('Quoted amount',aud(v.amount))+metric('Estimated cost',aud(v.cost))+metric('Estimated contribution',aud(v.amount-v.cost))+metric('Status',esc(v.status))+'</div><div class="card"><h2>Approval workflow</h2><p class="muted">This is an internal approval record, not client-authorised electronic acceptance. Obtain and retain contractual approval separately.</p><label class="field">Record status</label><select id="vstatus" class="control">'+['Pending approval','Approved','Rejected'].map(s=>'<option '+(s===v.status?'selected':'')+'>'+s+'</option>').join('')+'</select><div class="actions">'+btn('Save status','saveVariation(\''+v.id+'\')')+'</div><div class="notice">Approved variation amounts are not automatically added to project forecasts. Update the contract value and remaining costs after checking whether costs are already included, to avoid double-counting.</div></div>'}
function saveVariation(id){let v=state.variations.find(x=>x.id===id);v.status=$('vstatus').value;log('Variation status changed',id+' · '+v.status);render();toast('Status saved')}
function schedule(){return head('RIGHT TRADE. RIGHT TIME.','Trade scheduling','See dependencies and track delays before they affect the programme.')+'<div class="card">'+state.trades.map(t=>'<div class="line"><div><b>'+esc(t.trade)+'</b> '+pill(t.status)+'<p>'+esc(jobName(t.job))+' · '+esc(t.contractor)+' · '+esc(t.date)+'</p></div>'+btn(t.status==='Completed'?'Completed':'Update →','tradeUpdate(\''+t.id+'\')','alt')+'</div>').join('')+'</div><h2 class="section">Add trade booking</h2><div class="card"><div class="cols"><div><label class="field">Project</label><select id="job" class="control">'+state.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><label class="field">Trade</label><input id="trade" class="control" placeholder="Plastering"></div><div><label class="field">Subcontractor</label><input id="contractor" class="control" placeholder="Sample subcontractor"><label class="field">Scheduled date</label><input id="date" type="date" class="control"></div></div><div class="actions">'+btn('Add booking','addTrade()')+'</div></div>'}
function addTrade(){let trade=$('trade').value.trim(),contractor=$('contractor').value.trim(),date=$('date').value;if(!trade||!contractor||!date){toast('Complete all booking fields');return}let id='S'+(200+state.next++);state.trades.push({id,job:$('job').value,trade,contractor,date,status:'Scheduled'});log('Trade booked',id+' · '+trade);render()}
function tradeUpdate(id){let t=state.trades.find(x=>x.id===id),s=prompt('Set trade status: Scheduled, Delayed or Completed',t.status);if(!['Scheduled','Delayed','Completed'].includes(s))return;t.status=s;log('Trade status updated',id+' · '+s);render()}
function payments(){let outstanding=state.claims.filter(c=>c.status!=='Paid');return head('FOLLOW THE CASH','Payments & cash flow','Track progress claims and outstanding amounts across projects.')+'<div class="metrics">'+metric('Outstanding claims',aud(outstanding.reduce((s,c)=>s+c.amount,0)))+metric('Paid claims',aud(state.claims.filter(c=>c.status==='Paid').reduce((s,c)=>s+c.amount,0)))+metric('Unpaid claim count',outstanding.length)+metric('Projects',state.projects.length)+'</div><div class="card">'+state.claims.map(c=>'<div class="line"><div><b>'+esc(c.title)+'</b> '+pill(c.status)+'<p>'+esc(jobName(c.job))+' · '+aud(c.amount)+'</p></div>'+btn('Update →','claimUpdate(\''+c.id+'\')','alt')+'</div>').join('')+'</div><h2 class="section">Add payment milestone</h2><div class="card"><div class="cols"><div><label class="field">Project</label><select id="job" class="control">'+state.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><label class="field">Claim title</label><input id="title" class="control" placeholder="Progress claim 2"></div><div><label class="field">Amount (ex GST)</label><input id="amount" type="number" class="control" value="25000"></div></div><div class="actions">'+btn('Add claim','addClaim()')+'</div></div>'+notice()}
function addClaim(){let title=$('title').value.trim(),amount=+$('amount').value;if(!title||amount<=0){toast('Enter valid claim details');return}let id='I'+(200+state.next++);state.claims.push({id,job:$('job').value,title,amount,status:'Awaiting payment'});log('Claim registered',id+' · '+title);render()}
function claimUpdate(id){let c=state.claims.find(x=>x.id===id),s=prompt('Set status: Awaiting payment, Paid or Disputed',c.status);if(!['Awaiting payment','Paid','Disputed'].includes(s))return;c.status=s;log('Claim updated',id+' · '+s);render()}
function handover(){return head('FINISH STRONG','Defects & handover','Record issues, assign responsibility and close out handover items.')+'<div class="metrics">'+metric('Open defects',state.defects.filter(d=>d.status!=='Resolved').length)+metric('Resolved defects',state.defects.filter(d=>d.status==='Resolved').length)+metric('Active projects',state.projects.length)+metric('Recorded close-outs',state.events.filter(e=>e.type==='Defect resolved').length)+'</div><div class="card">'+state.defects.map(d=>'<div class="line"><div><b>'+esc(d.title)+'</b> '+pill(d.status)+'<p>'+esc(jobName(d.job))+' · Owner: '+esc(d.owner)+'</p></div>'+(d.status==='Resolved'?'':btn('Resolve →','resolveDefect(\''+d.id+'\')','alt'))+'</div>').join('')+'</div><h2 class="section">Add defect</h2><div class="card"><div class="cols"><div><label class="field">Project</label><select id="job" class="control">'+state.projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select><label class="field">Issue</label><input id="title" class="control" placeholder="Repair joinery edge"></div><div><label class="field">Responsible trade</label><input id="owner" class="control" placeholder="Joinery contractor"></div></div><div class="actions">'+btn('Log defect','addDefect()')+'</div></div>'}
function addDefect(){let title=$('title').value.trim(),owner=$('owner').value.trim();if(!title||!owner){toast('Complete defect fields');return}let id='D'+(200+state.next++);state.defects.push({id,job:$('job').value,title,owner,status:'Open'});log('Defect logged',id+' · '+title);render()}
function resolveDefect(id){if(!confirm('Mark this fictional defect as resolved?'))return;let d=state.defects.find(x=>x.id===id);d.status='Resolved';log('Defect resolved',id+' · '+d.title);render()}
function addAction(){let subject=$('subject').value.trim(),detail=$('detail').value.trim();if(!subject){toast('Enter task title');return}let id='T'+(200+state.next++);state.tasks.unshift({id,subject,detail,status:'Open',outcome:''});log('Task created',id+' · '+subject);render()}
function completeAction(id){let outcome=prompt('Record outcome:');if(!outcome?.trim())return;let t=state.tasks.find(x=>x.id===id);t.status='Completed';t.outcome=outcome.trim();log('Task completed',id+' · '+outcome);render()}
function actions(){return head('CLEAR OWNERSHIP','Action centre','Record follow-ups and maintain an audit trail of changes made in the demo.')+'<div class="card"><h2>Tasks</h2>'+(state.tasks.length?state.tasks.map(t=>'<div class="line"><div><b>'+esc(t.subject)+'</b> '+pill(t.status)+'<p>'+esc(t.detail)+(t.outcome?' · '+esc(t.outcome):'')+'</p></div>'+(t.status==='Completed'?'':btn('Complete →','completeAction(\''+t.id+'\')','alt'))+'</div>').join(''):'<div class="empty">No tasks recorded.</div>')+'</div><h2 class="section">New task</h2><div class="card"><label class="field">Task</label><input id="subject" class="control" placeholder="Follow up variation approval"><label class="field">Details</label><textarea id="detail" class="control"></textarea><div class="actions">'+btn('Create task','addAction()')+'</div></div><h2 class="section">Activity history</h2><div class="card">'+state.events.slice(0,30).map(e=>'<div class="line"><div><b>'+esc(e.type)+'</b><p>'+esc(e.detail)+'</p></div><small class="small">'+esc(e.at)+'</small></div>').join('')+'</div>'}
function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function download(name,rows){let blob=new Blob([rows.map(r=>r.map(csv).join(',')).join('\n')],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportProjects(){download('fitiq-projects.csv',[['ID','Project','Client','Contract value','Original budget','Actual cost','Committed cost','Remaining cost','Forecast profit','Forecast margin'],...state.projects.map(p=>[p.id,p.name,p.client,p.value,p.budget,p.spent,p.committed,p.remaining,profit(p),margin(p).toFixed(2)])])}
function exportAudit(){download('fitiq-audit.csv',[['Date','Type','Detail'],...state.events.map(e=>[e.at,e.type,e.detail])])}
function settings(){return head('WORKSPACE CONTROLS','Data & settings','Export your fictional results or reset this browser-local demo.')+'<div class="grid"><div class="card"><h2>Export records</h2><p class="muted">Download project forecasts and activity history as CSV files.</p><div class="actions">'+btn('Export projects CSV','exportProjects()')+btn('Export audit CSV','exportAudit()','alt')+'</div></div><div class="card"><h2>Reset demo</h2><p class="muted">Restores the fictional sample jobs, variations, claims and defects.</p>'+btn('Reset fictional data','reset()','light')+'</div></div>'+notice()+'<div class="notice">Production needs role-based access, secure hosting, document approvals, project accounting integrations, change-control rules and backups. No real client data should be entered here.</div>'}
function reset(){if(!confirm('Reset all FitIQ demo data?'))return;localStorage.removeItem('fitiq-v1');location.reload()}
render();const originalRender=render;render=function(){originalRender();if(page==='quotes')calcQuote()};render();
</script></body></html>
